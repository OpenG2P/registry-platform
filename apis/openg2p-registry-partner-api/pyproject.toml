[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openg2p-registry-partner-api"
authors = [
  { name="OpenG2P", email="info@openg2p.org" },
]
description = "OpenG2P Registry Partner API"
requires-python = ">=3.7"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
]
# NOTE: partner signature verification + consent enforcement use
# openg2p-fastapi-common's `build_crypto_helper` (partner-mgmt backend), which
# currently lives on the `develop` branch and is NOT yet in a tagged release.
# The container images install fastapi-common from the `develop` git ref
# (see farmer-registry/docker/partner-api/develop.txt), so this floor pin is
# satisfied there. When fastapi-common cuts a release containing
# `build_crypto_helper`, bump this floor and the tagged requirement files.
dependencies = [
  "openg2p-fastapi-common >=1.1.4",
  "httpx",
  "jsonpath_ng",
  "asyncpg",
  "psycopg2"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://openg2p.org"
Documentation = "https://docs.openg2p.org/"
Repository = "https://github.com/OpenG2P/registry-platform"
Source = "https://github.com/OpenG2P/registry-platform"

[tool.hatch.version]
path = "src/openg2p_registry_partner_api/__init__.py"
