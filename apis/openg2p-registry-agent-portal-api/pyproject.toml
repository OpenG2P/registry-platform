[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openg2p-registry-agent-portal-api"
authors = [
  { name="OpenG2P", email="info@openg2p.org" },
]
description = "OpenG2P Registry Agent Portal API (verifiable credential issuance)"
requires-python = ">=3.7"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
]
dependencies = [
  "openg2p-fastapi-common >=1.1.4",
  "asyncpg",
  "psycopg2",
  "httpx",
  "cryptography",
  "qrcode",
  "pillow",
  "cairosvg",
  "fpdf2"
]
dynamic = ["version"]

[project.urls]
Homepage = "https://openg2p.org"
Documentation = "https://docs.openg2p.org/"
Repository = "https://gitlab.com/openg2p/registry/registry-platform"
Source = "https://gitlab.com/openg2p/registry/registry-platform"

[tool.hatch.version]
path = "src/openg2p_registry_agent_portal_api/__init__.py"
