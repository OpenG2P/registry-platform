name: NPM Publish UI Widget

# Publishes @openg2p/registry-widgets via npm trusted publishing (OIDC).
#
# Automatic (any commit on develop or a release line N.N / RC):
#   next-patch-after-latest prerelease (e.g. latest 1.1.7 → 1.1.8-dev.N)
#   → npm publish --tag dev
#   → pin staff-ui to that exact prerelease
#   Never publishes dist-tag latest.
#
# Release (manual only): Run workflow → enter version (e.g. 1.1.8)
#   → npm publish (dist-tag latest) → pin staff-ui
#
# npm trusted publisher (one per package):
#   Repository: OpenG2P/registry-platform
#   Workflow filename: npm-publish-ui-widgets.yml
on:
  push:
    branches:
      - develop
      - '*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (semver, e.g. 1.1.8) — publishes dist-tag latest'
        required: true
        type: string

jobs:
  publish-dev:
    # develop + RC (N.N). Exact N.N vs noise like ci/foo.bar is gated below.
    if: >-
      github.event_name == 'push' && github.ref_type == 'branch' &&
      (github.ref == 'refs/heads/develop' || contains(github.ref_name, '.'))
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-ui-widgets-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ui/ui-widgets
    permissions:
      id-token: write
      contents: write
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          # Same-repo GITHUB_TOKEN (openg2pbot PAT cannot push here).
          token: ${{ github.token }}

      - name: Skip if not a widget-changing develop/RC push
        id: gate
        working-directory: ${{ github.workspace }}
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$REF_NAME" != "develop" ] && ! [[ "$REF_NAME" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "Not develop or a release line ($REF_NAME); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if git diff --quiet "$BEFORE" "$SHA" -- ui/ui-widgets .github/workflows/npm-publish-ui-widgets.yml; then
              echo "No ui-widgets changes on this push; skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        if: steps.gate.outputs.skip != 'true'
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: npm ci

      - name: Type check
        if: steps.gate.outputs.skip != 'true'
        run: npm run type-check

      - name: Set dev prerelease version
        if: steps.gate.outputs.skip != 'true'
        # Always version on the *next patch after npm `latest`*, not the
        # already-released line. If latest is 1.1.7, publish 1.1.8-dev.N
        # where N is one past the highest already-published 1.1.8-dev.*.
        run: |
          node <<'EOF'
          const { execSync } = require('child_process');
          const pkg = require('./package.json');

          function npmView(field) {
            try {
              return execSync(`npm view ${pkg.name} ${field} --json`, {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'ignore'],
              }).trim();
            } catch {
              return '';
            }
          }

          function parse(v) {
            const m = String(v || '').match(/^(\d+)\.(\d+)\.(\d+)(?:-dev\.(\d+))?$/);
            if (!m) return null;
            return { major: +m[1], minor: +m[2], patch: +m[3], dev: m[4] != null ? +m[4] : null };
          }

          let latestRaw = '';
          try {
            const parsed = JSON.parse(npmView('dist-tags.latest') || 'null');
            latestRaw = parsed || '';
          } catch {
            latestRaw = '';
          }

          const local = parse(pkg.version);
          const latest = parse(latestRaw);

          let future;
          if (latest) {
            future = `${latest.major}.${latest.minor}.${latest.patch + 1}`;
          } else if (local && local.dev !== null) {
            future = `${local.major}.${local.minor}.${local.patch}`;
          } else if (local) {
            future = `${local.major}.${local.minor}.${local.patch + 1}`;
          } else {
            console.error(`::error::Cannot parse versions (latest='${latestRaw}', local='${pkg.version}')`);
            process.exit(1);
          }

          let versions = [];
          try {
            const raw = JSON.parse(npmView('versions') || '[]');
            versions = Array.isArray(raw) ? raw : raw ? [raw] : [];
          } catch {
            versions = [];
          }

          const prefix = `${future}-dev.`;
          let maxDev = -1;
          for (const v of versions) {
            if (typeof v === 'string' && v.startsWith(prefix)) {
              const n = Number(v.slice(prefix.length));
              if (Number.isInteger(n)) maxDev = Math.max(maxDev, n);
            }
          }

          const target = `${prefix}${maxDev + 1}`;
          console.log(`latest=${latestRaw || '(none)'} local=${pkg.version} → ${target}`);
          execSync(`npm version ${JSON.stringify(target)} --no-git-tag-version --allow-same-version`, {
            stdio: 'inherit',
          });
          EOF

      - name: Build
        if: steps.gate.outputs.skip != 'true'
        run: npm run build

      - name: Publish to npm (dist-tag dev)
        if: steps.gate.outputs.skip != 'true'
        run: npm publish --tag dev --access public

      - name: Commit version and sync staff-ui
        if: steps.gate.outputs.skip != 'true'
        working-directory: ${{ github.workspace }}
        env:
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WIDGET_VERSION=$(node -p "require('./ui/ui-widgets/package.json').version")

          # Do not `npm install` the just-published prerelease from the
          # registry: setup-node's npmrc + lockfile resolution yields ETARGET
          # even when the version is already on npm. Pin from the local pack
          # (same tarball we published) so staff-ui/package.json stays an
          # exact registry version and Docker `npm ci` can fetch it later.
          (cd ui/ui-widgets && npm pack --json > /tmp/widgets-pack.json)
          PACK_FILE=$(node -p "const d=require('/tmp/widgets-pack.json'); (Array.isArray(d)?d[0]:d).filename")
          PACK_INTEGRITY=$(node -p "const d=require('/tmp/widgets-pack.json'); (Array.isArray(d)?d[0]:d).integrity")
          rm -f "ui/ui-widgets/${PACK_FILE}"

          WIDGET_VERSION="$WIDGET_VERSION" PACK_INTEGRITY="$PACK_INTEGRITY" node <<'EOF'
          const fs = require('fs');
          const version = process.env.WIDGET_VERSION;
          const integrity = process.env.PACK_INTEGRITY;
          const resolved = `https://registry.npmjs.org/@openg2p/registry-widgets/-/registry-widgets-${version}.tgz`;
          const widgetPkg = JSON.parse(fs.readFileSync('ui/ui-widgets/package.json', 'utf8'));

          const pkgPath = 'ui/staff-ui/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.dependencies['@openg2p/registry-widgets'] = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const lockPath = 'ui/staff-ui/package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.packages[''].dependencies['@openg2p/registry-widgets'] = version;
          const entry = lock.packages['node_modules/@openg2p/registry-widgets'];
          if (!entry) {
            console.error('::error::staff-ui lockfile has no node_modules/@openg2p/registry-widgets entry');
            process.exit(1);
          }
          entry.version = version;
          entry.resolved = resolved;
          entry.integrity = integrity;
          if (widgetPkg.dependencies) entry.dependencies = widgetPkg.dependencies;
          if (widgetPkg.peerDependencies) entry.peerDependencies = widgetPkg.peerDependencies;
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');
          console.log(`pinned staff-ui → @openg2p/registry-widgets@${version}`);
          EOF

          git add ui/ui-widgets/package.json ui/ui-widgets/package-lock.json \
            ui/staff-ui/package.json ui/staff-ui/package-lock.json
          if ! git diff --staged --quiet; then
            if [ "$REF_NAME" = "develop" ]; then
              git commit -m "chore(ui-widgets): version for npm dev publish, sync staff-ui @${WIDGET_VERSION} [skip ci]"
            else
              git commit -m "chore(ui-widgets): version for npm dev publish, sync staff-ui @${WIDGET_VERSION}"
            fi
          fi

          git push origin "HEAD:${REF_NAME}"

          # GITHUB_TOKEN pushes do not start new workflows. On an RC line the
          # concurrent Build & Publish run is waiting on this pin — dispatch
          # it against the new HEAD so staff-ui is built with the install.
          if [ "$REF_NAME" != "develop" ]; then
            gh workflow run "Build & Publish" --ref "$REF_NAME"
          fi

  publish-release:
    # Frozen latest only — never on develop / RC / tag pushes.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-ui-widgets-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ui/ui-widgets
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Validate version
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$VERSION'. Use semver without prefix (e.g. 1.1.8)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Set release version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Verify version is not already published
        run: |
          if npm view "@openg2p/registry-widgets@${{ inputs.version }}" version 2>/dev/null; then
            echo "Version ${{ inputs.version }} is already published on npm."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish to npm (latest)
        run: npm publish --access public

      - name: Commit version and sync staff-ui
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WIDGET_VERSION=$(node -p "require('./ui/ui-widgets/package.json').version")

          (cd ui/ui-widgets && npm pack --json > /tmp/widgets-pack.json)
          PACK_FILE=$(node -p "const d=require('/tmp/widgets-pack.json'); (Array.isArray(d)?d[0]:d).filename")
          PACK_INTEGRITY=$(node -p "const d=require('/tmp/widgets-pack.json'); (Array.isArray(d)?d[0]:d).integrity")
          rm -f "ui/ui-widgets/${PACK_FILE}"

          WIDGET_VERSION="$WIDGET_VERSION" PACK_INTEGRITY="$PACK_INTEGRITY" node <<'EOF'
          const fs = require('fs');
          const version = process.env.WIDGET_VERSION;
          const integrity = process.env.PACK_INTEGRITY;
          const resolved = `https://registry.npmjs.org/@openg2p/registry-widgets/-/registry-widgets-${version}.tgz`;
          const widgetPkg = JSON.parse(fs.readFileSync('ui/ui-widgets/package.json', 'utf8'));

          const pkgPath = 'ui/staff-ui/package.json';
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.dependencies['@openg2p/registry-widgets'] = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const lockPath = 'ui/staff-ui/package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.packages[''].dependencies['@openg2p/registry-widgets'] = version;
          const entry = lock.packages['node_modules/@openg2p/registry-widgets'];
          if (!entry) {
            console.error('::error::staff-ui lockfile has no node_modules/@openg2p/registry-widgets entry');
            process.exit(1);
          }
          entry.version = version;
          entry.resolved = resolved;
          entry.integrity = integrity;
          if (widgetPkg.dependencies) entry.dependencies = widgetPkg.dependencies;
          if (widgetPkg.peerDependencies) entry.peerDependencies = widgetPkg.peerDependencies;
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');
          console.log(`pinned staff-ui → @openg2p/registry-widgets@${version}`);
          EOF

          git add ui/ui-widgets/package.json ui/ui-widgets/package-lock.json \
            ui/staff-ui/package.json ui/staff-ui/package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ui-widgets): release v${WIDGET_VERSION}, sync staff-ui"
          fi

          git push
