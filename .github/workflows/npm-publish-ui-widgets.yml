name: NPM Publish UI Widget

# Publishes @openg2p/registry-widgets to npm with dist-tag "next" via npm trusted
# publishing (OIDC). No long-lived NPM_TOKEN is required for publish.
#
# One-time setup on npmjs.com (package → Settings → Trusted publishing):
#   - Provider: GitHub Actions
#   - Repository: OpenG2P/registry-platform
#   - Workflow filename: npm-publish-ui-widgets.yml  (exact match, case-sensitive)
#
# Requires npm CLI ≥ 11.5.1 and Node ≥ 22.14.0 (see npm trusted publishers docs).
# Provenance attestations are generated automatically when publishing via OIDC.
#
# Install dev builds:
#   npm install @openg2p/registry-widgets@next
on:
  push:
    branches:
      - develop
    paths:
      - 'ui/ui-widgets/**'
      - '.github/workflows/npm-publish-ui-widgets.yml'
  workflow_dispatch:

concurrency:
  group: npm-publish-ui-widgets
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/ui-widgets
    permissions:
      id-token: write   # Required for npm trusted publishing (OIDC)
      contents: write   # Version bump commit after publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Bump dev prerelease version
        run: npm version prerelease --preid=dev --no-git-tag-version

      - name: Build
        run: npm run build

      - name: Publish to npm (dist-tag next, OIDC)
        run: npm publish --tag next --access public

      - name: Commit version bump
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui/ui-widgets/package.json ui/ui-widgets/package-lock.json
          git diff --staged --quiet && echo "No version files to commit" && exit 0
          git commit -m "chore(ui-widgets): bump version for npm next publish [skip ci]"
          git push
