name: NPM Publish UI Widget

# Publishes @openg2p/registry-widgets via npm trusted publishing (OIDC).
#
# Dev (automatic): push to develop → dev prerelease version → publish --tag next
#   → sync staff-portal-ui → commit (ui-widgets + staff-portal-ui)
# Release (manual): Run workflow → enter version (e.g. 1.1.0) → publish latest
#   → sync staff-portal-ui → commit (ui-widgets + staff-portal-ui)
#
# npm trusted publisher (one per package):
#   Repository: OpenG2P/registry-platform
#   Workflow filename: npm-publish-ui-widgets.yml
on:
  push:
    branches:
      - develop
    paths:
      - 'ui/ui-widgets/**'
      - '.github/workflows/npm-publish-ui-widgets.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (server, e.g. 1.1.0)'
        required: true
        type: string

jobs:
  publish-dev:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-ui-widgets-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ui/ui-widgets
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Set dev prerelease version
        # Self-heal against drift: seed the local version from the HIGHEST
        # version ever published, then bump, so the result is newer than
        # everything on npm and can never 403 as a republish.
        #
        # Seeding from the `next` dist-tag was not enough: `next` only moves when
        # THIS job publishes, while release branches publish `latest` and other
        # prereleases land under other tags. It sat at 1.1.6-dev.3 while dev.4..6
        # and 1.1.6..1.1.8 were published, so the bump recomputed dev.4 and 403'd.
        run: |
          VERSIONS=$(npm view @openg2p/registry-widgets versions --json 2>/dev/null || echo '[]')
          HIGHEST=$(echo "$VERSIONS" | node -e '
            const vs = [].concat(JSON.parse(require("fs").readFileSync(0, "utf8")));
            // x.y.z[-pre.N]; a release sorts above its own prereleases.
            const key = v => { const [core, pre] = v.split("-");
              const n = core.split(".").map(Number);
              const p = pre ? Number(pre.split(".").pop()) : Infinity;
              return [...n, pre ? 0 : 1, p]; };
            const cmp = (a, b) => { const x = key(a), y = key(b);
              for (let i = 0; i < x.length; i++) if (x[i] !== y[i]) return x[i] < y[i] ? -1 : 1;
              return 0; };
            vs.sort(cmp); process.stdout.write(vs.length ? vs[vs.length - 1] : "");')
          echo "highest published: ${HIGHEST:-<none>}"
          if [ -n "$HIGHEST" ]; then
            npm version "$HIGHEST" --no-git-tag-version --allow-same-version
          fi
          npm version prerelease --preid=dev --no-git-tag-version
          echo "publishing as: $(node -p "require('./package.json').version")"

      - name: Build
        run: npm run build

      - name: Publish to npm (dist-tag next)
        run: npm publish --tag next --access public

      - name: Commit version and sync staff-portal-ui
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WIDGET_VERSION=$(node -p "require('./ui/ui-widgets/package.json').version")

          # The version was just published; npm's registry can lag several
          # seconds before it is installable — retry until it propagates so this
          # sync (and the commit-back below) doesn't fail on a race.
          for i in $(seq 1 12); do
            npm install "@openg2p/registry-widgets@${WIDGET_VERSION}" --prefix ui/staff-ui && break
            echo "waiting for npm to propagate @openg2p/registry-widgets@${WIDGET_VERSION} (attempt $i/12)…"
            sleep 15
          done
          npm view "@openg2p/registry-widgets@${WIDGET_VERSION}" version >/dev/null 2>&1 \
            || { echo "::error::@openg2p/registry-widgets@${WIDGET_VERSION} still not installable after retries"; exit 1; }

          git add ui/ui-widgets/package.json ui/ui-widgets/package-lock.json \
            ui/staff-ui/package.json ui/staff-ui/package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ui-widgets): version for npm next publish, sync staff-portal-ui @${WIDGET_VERSION} [skip ci]"
          fi

          git push

  publish-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-ui-widgets-release
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ui/ui-widgets
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Validate version
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$VERSION'. Use semver without prefix (e.g. 1.1.0)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Set release version
        run: npm version "${{ inputs.version }}" --no-git-tag-version --allow-same-version

      - name: Verify version is not already published
        run: |
          if npm view "@openg2p/registry-widgets@${{ inputs.version }}" version 2>/dev/null; then
            echo "Version ${{ inputs.version }} is already published on npm."
            exit 1
          fi

      - name: Build
        run: npm run build

      - name: Publish to npm (latest)
        run: npm publish --access public

      - name: Commit version and sync staff-portal-ui
        working-directory: ${{ github.workspace }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WIDGET_VERSION=$(node -p "require('./ui/ui-widgets/package.json').version")

          # The version was just published; npm's registry can lag several
          # seconds before it is installable — retry until it propagates so this
          # sync (and the commit-back below) doesn't fail on a race.
          for i in $(seq 1 12); do
            npm install "@openg2p/registry-widgets@${WIDGET_VERSION}" --prefix ui/staff-ui && break
            echo "waiting for npm to propagate @openg2p/registry-widgets@${WIDGET_VERSION} (attempt $i/12)…"
            sleep 15
          done
          npm view "@openg2p/registry-widgets@${WIDGET_VERSION}" version >/dev/null 2>&1 \
            || { echo "::error::@openg2p/registry-widgets@${WIDGET_VERSION} still not installable after retries"; exit 1; }

          git add ui/ui-widgets/package.json ui/ui-widgets/package-lock.json \
            ui/staff-ui/package.json ui/staff-ui/package-lock.json
          if ! git diff --staged --quiet; then
            git commit -m "chore(ui-widgets): release v${WIDGET_VERSION}, sync staff-portal-ui [skip ci]"
          fi

          git push
