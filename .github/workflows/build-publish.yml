name: Build & Publish (base images + chart)

# Publishes the registry-platform's deployable artifacts:
#   - the per-component reference-registry Docker images (docker/*/Dockerfile). These bundle
#     the platform code + a minimal reference registry (individual + household); a variant
#     (NSR, farmer, a customer) builds FROM these and adds its extension.
#   - the consolidated openg2p-registry Helm chart (helm/openg2p-registry),
#     the single source of truth for registry deployment.
#
# This inverts the old model where each downstream registry owned its own
# Dockerfiles and a full copy of the chart. Downstream repos now ship only their
# extension + a thin FROM-base Dockerfile + a values overlay.
#
# The Next.js Staff Portal UI image is published separately by
# docker-staff-portal-ui.yml, and the ui-widgets npm package by
# npm-publish-ui-widgets.yml — those are unchanged.
#
# All versioning / build / promote / publish / changelog policy lives in
# openg2p-packaging behind @v1.

on:
  push:
    branches: ["**"]
    tags: ["**"]
  workflow_dispatch:
    inputs:
      changelog_skip_ai:
        description: 'Skip the AI summary — publish the changelog from commit messages only. Leave OFF for a normal run.'
        type: boolean
        default: false
      changelog_regenerate:
        description: 'Backfill the AI summary for a frozen release e.g. 1.0.1. Leave EMPTY for a normal run.'
        type: string
        default: ''

jobs:
  build-publish:
    uses: openg2p/openg2p-packaging/.github/workflows/build-publish.yml@v1
    with:
      changelog_skip_ai: ${{ inputs.changelog_skip_ai || false }}
      changelog_regenerate: ${{ inputs.changelog_regenerate || '' }}

      # One entry per BASE image. Unlike the downstream registries, there is NO
      # REGISTRY_PLATFORM_REF pin here — the platform packages are this repo's
      # own working tree (COPY-ed in the Dockerfiles), so the only git-ref pins
      # are the external fastapi-common / iam-service libs (and openg2p-data for
      # db-seed). CI resolves each moving ref to a SHA and stamps it as an
      # org.openg2p.pin.<arg> label for reproducibility.
      images: |
        [
          {"name": "staff-api",
           "repo": "openg2p/openg2p-registry-staff-api",
           "dockerfile": "docker/staff-api/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF", "repo": "https://github.com/openg2p/openg2p-fastapi-common", "ref": "develop"},
             {"arg": "IAM_CORE_REF",       "repo": "https://github.com/openg2p/iam-service",            "ref": "develop"}
           ]},

          {"name": "partner-api",
           "repo": "openg2p/openg2p-registry-partner-api",
           "dockerfile": "docker/partner-api/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF", "repo": "https://github.com/openg2p/openg2p-fastapi-common", "ref": "develop"},
             {"arg": "IAM_CORE_REF",       "repo": "https://github.com/openg2p/iam-service",            "ref": "develop"}
           ]},

          {"name": "bene-api",
           "repo": "openg2p/openg2p-registry-bene-api",
           "dockerfile": "docker/bene-api/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF", "repo": "https://github.com/openg2p/openg2p-fastapi-common", "ref": "develop"},
             {"arg": "IAM_CORE_REF",       "repo": "https://github.com/openg2p/iam-service",            "ref": "develop"}
           ]},

          {"name": "celery",
           "repo": "openg2p/openg2p-registry-celery",
           "dockerfile": "docker/celery/Dockerfile",
           "pins": [
             {"arg": "FASTAPI_COMMON_REF", "repo": "https://github.com/openg2p/openg2p-fastapi-common", "ref": "develop"},
             {"arg": "IAM_CORE_REF",       "repo": "https://github.com/openg2p/iam-service",            "ref": "develop"}
           ]},

          {"name": "db-seed",
           "repo": "openg2p/openg2p-registry-db-seed",
           "dockerfile": "docker/db-seed/Dockerfile",
           "pins": [
             {"arg": "OPENG2P_DATA_BRANCH", "repo": "https://github.com/openg2p/openg2p-data", "ref": "2.0"}
           ]}
        ]

      chart-path: helm/openg2p-registry

      # These images ARE the chart's default (reference-registry) images, so CI
      # rewrites the chart's image tags to the freshly built version — the chart
      # then works out-of-the-box as the reference registry, and a variant
      # overlay overrides these repos with its own. (staffUi is published by
      # docker-staff-portal-ui.yml; sanity-tests by its own build — not here.)
      chart-image-paths: |
        [".staffApi.image.tag",
         ".partnerApi.image.tag",
         ".beneApi.image.tag",
         ".celeryWorker.image.tag",
         ".celeryBeat.image.tag",
         ".dbSeed.image.tag"]

      packaging-ref: v1

    secrets:
      docker_hub_actor: ${{ secrets.docker_hub_actor }}
      docker_hub_token: ${{ secrets.docker_hub_token }}
      OPENG2P_BOT_GITHUB_PAT: ${{ secrets.OPENG2P_BOT_GITHUB_PAT }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
