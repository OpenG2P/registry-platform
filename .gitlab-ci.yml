# registry-platform — build & publish on GitLab.
#
# Generated by openg2p/packaging ci/migrate/github-to-gitlab.sh, translated
# from this repo's GitHub caller. All versioning/build/publish logic lives
# centrally in openg2p/packaging@v1; this file only declares what THIS repo has.
#
#   images -> registry.gitlab.com/openg2p/registry/registry-platform/<name>   (this project)
#   chart  -> openg2p/charts Helm registry                (shared catalogue)

include:
  - project: 'openg2p/packaging'
    ref: v1
    file: '/ci/gitlab/build-publish.yml'

variables:
  PACKAGING_REF: v1

  # Reuse published layers instead of reinstalling dependencies on every build.
  # This repo builds five images and spent ~5.8 of its ~9.4 build minutes redoing
  # identical pip/npm/apk installs, so it is the first place this is worth it.
  # Trial knob -- the wrapper defaults it off for every other repo.
  BUILD_CACHE: "true"

  IMAGES: |
    [
      {
        "name": "staff-api",
        "dockerfile": "docker/staff-api/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          },
          {
            "arg": "IAM_CORE_REF",
            "repo": "https://gitlab.com/openg2p/iam.git",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "partner-api",
        "dockerfile": "docker/partner-api/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          },
          {
            "arg": "IAM_CORE_REF",
            "repo": "https://gitlab.com/openg2p/iam.git",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "bene-api",
        "dockerfile": "docker/bene-api/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          },
          {
            "arg": "IAM_CORE_REF",
            "repo": "https://gitlab.com/openg2p/iam.git",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "agent-portal-api",
        "dockerfile": "docker/agent-portal-api/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          },
          {
            "arg": "IAM_CORE_REF",
            "repo": "https://gitlab.com/openg2p/iam.git",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "celery",
        "dockerfile": "docker/celery/Dockerfile",
        "pins": [
          {
            "arg": "FASTAPI_COMMON_REF",
            "repo": "https://github.com/openg2p/openg2p-fastapi-common",
            "ref": "develop"
          },
          {
            "arg": "IAM_CORE_REF",
            "repo": "https://gitlab.com/openg2p/iam.git",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "db-seed",
        "dockerfile": "docker/db-seed/Dockerfile",
        "pins": [
          {
            "arg": "OPENG2P_DATA_BRANCH",
            "repo": "https://github.com/openg2p/openg2p-data",
            "ref": "develop"
          }
        ]
      },
      {
        "name": "sanity-tests",
        "dockerfile": "docker/sanity/Dockerfile"
      },
      {
        "name": "staff-ui",
        "dockerfile": "ui/staff-ui/Dockerfile",
        "context": "ui/staff-ui"
      },
      {
        "name": "agent-ui",
        "dockerfile": "ui/agent-ui/Dockerfile",
        "context": "ui/agent-ui"
      }
    ]

  CHART_PATH: helm/openg2p-registry
  CHART_IMAGE_PATHS: '[".staffApi.image.tag",".partnerApi.image.tag",".beneApi.image.tag",".agentPortalApi.image.tag",".celeryWorker.image.tag",".celeryBeat.image.tag",".dbSeed.image.tag",".staffUi.image.tag",".agentPortalUi.image.tag",".sanity.image.tag"]'
  CHART_GITLAB_PROJECT: openg2p/charts
