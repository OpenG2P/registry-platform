[pytest]
testpaths = workflows
pythonpath = .
markers =
    smoke: fast staff-api workflow subset
    intake: intake form workflows
    change_request: change-request workflows
    register: register browse / read workflows
    individual: individual register scenarios
    household: household register scenarios
    tier1: Staff Tier-1 endpoint suites (api/staff; not PR gate by default)
    tier2: Staff Tier-2 secondary endpoint suites (api/staff; not PR gate by default)
    tier3: Partner Tier-3 suites (api/partner; not PR gate by default)
    partner: Partner API scenarios
filterwarnings =
    ignore::DeprecationWarning
