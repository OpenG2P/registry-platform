<svg width="1400" height="900" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1400" height="900" fill="#f5f5f5"/>
  
  <!-- Header -->
  <rect width="1400" height="60" fill="#2c3e50"/>
  <text x="20" y="40" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white">Section JSON Builder</text>
  <circle cx="1370" cy="30" r="12" fill="#e74c3c"/>
  <text x="1365" y="35" font-family="Arial, sans-serif" font-size="14" fill="white">×</text>
  
  <!-- Left Panel - JSON Editor -->
  <rect x="20" y="80" width="650" height="800" fill="white" stroke="#ddd" stroke-width="2" rx="4"/>
  <text x="30" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">JSON Editor</text>
  
  <!-- JSON Editor Content Area -->
  <rect x="30" y="130" width="630" height="650" fill="#1e1e1e" stroke="#444" stroke-width="1" rx="2"/>
  
  <!-- JSON Code (simplified representation) -->
  <text x="40" y="160" font-family="Monaco, monospace" font-size="12" fill="#d4d4d4">{</text>
  <text x="50" y="180" font-family="Monaco, monospace" font-size="12" fill="#9cdcfe">  "section-id"</text>
  <text x="200" y="180" font-family="Monaco, monospace" font-size="12" fill="#ce9178">: "main-content"</text>
  <text x="50" y="200" font-family="Monaco, monospace" font-size="12" fill="#9cdcfe">  "section-title"</text>
  <text x="200" y="200" font-family="Monaco, monospace" font-size="12" fill="#ce9178">: "Personal Information"</text>
  <text x="50" y="220" font-family="Monaco, monospace" font-size="12" fill="#9cdcfe">  "section-editable"</text>
  <text x="200" y="220" font-family="Monaco, monospace" font-size="12" fill="#569cd6">: true</text>
  <text x="50" y="240" font-family="Monaco, monospace" font-size="12" fill="#9cdcfe">  "panels"</text>
  <text x="200" y="240" font-family="Monaco, monospace" font-size="12" fill="#d4d4d4">: [</text>
  <text x="60" y="260" font-family="Monaco, monospace" font-size="12" fill="#d4d4d4">{</text>
  <text x="70" y="280" font-family="Monaco, monospace" font-size="12" fill="#9cdcfe">    "panel-id"</text>
  <text x="220" y="280" font-family="Monaco, monospace" font-size="12" fill="#ce9178">: "personal-details"</text>
  <text x="70" y="300" font-family="Monaco, monospace" font-size="12" fill="#9cdcfe">    "panel-orientation"</text>
  <text x="220" y="300" font-family="Monaco, monospace" font-size="12" fill="#ce9178">: "horizontal"</text>
  <text x="70" y="320" font-family="Monaco, monospace" font-size="12" fill="#9cdcfe">    "widgets"</text>
  <text x="220" y="320" font-family="Monaco, monospace" font-size="12" fill="#d4d4d4">: [</text>
  <text x="80" y="340" font-family="Monaco, monospace" font-size="12" fill="#d4d4d4">{</text>
  <text x="90" y="360" font-family="Monaco, monospace" font-size="12" fill="#9cdcfe">      "widget"</text>
  <text x="240" y="360" font-family="Monaco, monospace" font-size="12" fill="#ce9178">: "text"</text>
  <text x="90" y="380" font-family="Monaco, monospace" font-size="12" fill="#9cdcfe">      "widget-id"</text>
  <text x="240" y="380" font-family="Monaco, monospace" font-size="12" fill="#ce9178">: "name"</text>
  <text x="90" y="400" font-family="Monaco, monospace" font-size="12" fill="#9cdcfe">      "widget-label"</text>
  <text x="240" y="400" font-family="Monaco, monospace" font-size="12" fill="#ce9178">: "Full Name"</text>
  <text x="80" y="420" font-family="Monaco, monospace" font-size="12" fill="#d4d4d4">    }</text>
  <text x="70" y="440" font-family="Monaco, monospace" font-size="12" fill="#d4d4d4">  ]</text>
  <text x="60" y="460" font-family="Monaco, monospace" font-size="12" fill="#d4d4d4">}</text>
  <text x="50" y="480" font-family="Monaco, monospace" font-size="12" fill="#d4d4d4">]</text>
  <text x="40" y="500" font-family="Monaco, monospace" font-size="12" fill="#d4d4d4">}</text>
  
  <!-- Line numbers (left side) -->
  <text x="35" y="160" font-family="Monaco, monospace" font-size="11" fill="#858585">1</text>
  <text x="35" y="180" font-family="Monaco, monospace" font-size="11" fill="#858585">2</text>
  <text x="35" y="200" font-family="Monaco, monospace" font-size="11" fill="#858585">3</text>
  <text x="35" y="220" font-family="Monaco, monospace" font-size="11" fill="#858585">4</text>
  <text x="35" y="240" font-family="Monaco, monospace" font-size="11" fill="#858585">5</text>
  
  <!-- Validation Status -->
  <rect x="30" y="800" width="630" height="60" fill="#f8f9fa" stroke="#ddd" stroke-width="1" rx="2"/>
  <circle cx="50" cy="830" r="8" fill="#28a745"/>
  <text x="70" y="835" font-family="Arial, sans-serif" font-size="12" fill="#28a745">Valid JSON Schema</text>
  <text x="30" y="855" font-family="Arial, sans-serif" font-size="11" fill="#666">Schema validation: All properties are valid</text>
  
  <!-- Right Panel - Visual Builder -->
  <rect x="690" y="80" width="690" height="800" fill="white" stroke="#ddd" stroke-width="2" rx="4"/>
  <text x="700" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2c3e50">Visual Builder</text>
  
  <!-- Tree View Section -->
  <rect x="700" y="130" width="330" height="400" fill="#f8f9fa" stroke="#ddd" stroke-width="1" rx="2"/>
  <text x="710" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Section Structure</text>
  
  <!-- Tree Items -->
  <rect x="710" y="170" width="310" height="30" fill="#e3f2fd" stroke="#2196f3" stroke-width="1" rx="2"/>
  <text x="720" y="190" font-family="Arial, sans-serif" font-size="13" fill="#1976d2">📁 Section: main-content</text>
  <circle cx="1000" cy="185" r="10" fill="#2196f3"/>
  <text x="996" y="190" font-family="Arial, sans-serif" font-size="10" fill="white">⚙</text>
  
  <!-- Nested Panel -->
  <line x1="730" y1="200" x2="730" y2="250" stroke="#bbb" stroke-width="1"/>
  <line x1="730" y1="250" x2="750" y2="250" stroke="#bbb" stroke-width="1"/>
  <rect x="750" y="230" width="270" height="30" fill="#fff3e0" stroke="#ff9800" stroke-width="1" rx="2"/>
  <text x="760" y="250" font-family="Arial, sans-serif" font-size="12" fill="#e65100">📦 Panel: personal-details</text>
  <circle cx="1000" cy="245" r="10" fill="#ff9800"/>
  <text x="996" y="250" font-family="Arial, sans-serif" font-size="10" fill="white">⚙</text>
  
  <!-- Nested Widget -->
  <line x1="770" y1="260" x2="770" y2="310" stroke="#bbb" stroke-width="1"/>
  <line x1="770" y1="310" x2="790" y2="310" stroke="#bbb" stroke-width="1"/>
  <rect x="790" y="290" width="230" height="30" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" rx="2"/>
  <text x="800" y="310" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">🔧 Widget: name (text)</text>
  <circle cx="1000" cy="305" r="10" fill="#4caf50"/>
  <text x="996" y="310" font-family="Arial, sans-serif" font-size="10" fill="white">⚙</text>
  
  <!-- Another Widget -->
  <line x1="770" y1="320" x2="770" y2="370" stroke="#bbb" stroke-width="1"/>
  <line x1="770" y1="370" x2="790" y2="370" stroke="#bbb" stroke-width="1"/>
  <rect x="790" y="350" width="230" height="30" fill="#e8f5e9" stroke="#4caf50" stroke-width="1" rx="2"/>
  <text x="800" y="370" font-family="Arial, sans-serif" font-size="12" fill="#2e7d32">🔧 Widget: email (text)</text>
  <circle cx="1000" cy="365" r="10" fill="#4caf50"/>
  <text x="996" y="370" font-family="Arial, sans-serif" font-size="10" fill="white">⚙</text>
  
  <!-- Add Buttons -->
  <rect x="710" y="550" width="150" height="35" fill="#2196f3" stroke="#1976d2" stroke-width="1" rx="4"/>
  <text x="750" y="572" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">+ Add Panel</text>
  
  <rect x="870" y="550" width="150" height="35" fill="#4caf50" stroke="#388e3c" stroke-width="1" rx="4"/>
  <text x="900" y="572" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">+ Add Widget</text>
  
  <!-- Properties Panel -->
  <rect x="1050" y="130" width="320" height="660" fill="#f8f9fa" stroke="#ddd" stroke-width="1" rx="2"/>
  <text x="1060" y="155" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Properties</text>
  
  <!-- Selected Item Header -->
  <rect x="1060" y="170" width="300" height="40" fill="#2196f3" stroke="#1976d2" stroke-width="1" rx="2"/>
  <text x="1070" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">Panel: personal-details</text>
  
  <!-- Property Fields -->
  <text x="1060" y="240" font-family="Arial, sans-serif" font-size="12" fill="#333">Panel ID *</text>
  <rect x="1060" y="245" width="300" height="32" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="1070" y="265" font-family="Arial, sans-serif" font-size="12" fill="#666">personal-details</text>
  
  <text x="1060" y="295" font-family="Arial, sans-serif" font-size="12" fill="#333">Orientation</text>
  <rect x="1060" y="300" width="300" height="32" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
  <polygon points="1340,310 1350,320 1340,330" fill="#666"/>
  <text x="1070" y="320" font-family="Arial, sans-serif" font-size="12" fill="#666">horizontal</text>
  
  <text x="1060" y="350" font-family="Arial, sans-serif" font-size="12" fill="#333">Column Span</text>
  <rect x="1060" y="355" width="300" height="32" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="1070" y="375" font-family="Arial, sans-serif" font-size="12" fill="#666">1</text>
  
  <!-- Widget-specific properties (if widget selected) -->
  <text x="1060" y="410" font-family="Arial, sans-serif" font-size="12" fill="#333">Widget Type</text>
  <rect x="1060" y="415" width="300" height="32" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
  <polygon points="1340,425 1350,435 1340,445" fill="#666"/>
  <text x="1070" y="435" font-family="Arial, sans-serif" font-size="12" fill="#666">text</text>
  
  <text x="1060" y="465" font-family="Arial, sans-serif" font-size="12" fill="#333">Widget Label</text>
  <rect x="1060" y="470" width="300" height="32" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="1070" y="490" font-family="Arial, sans-serif" font-size="12" fill="#999">Enter label...</text>
  
  <text x="1060" y="520" font-family="Arial, sans-serif" font-size="12" fill="#333">Data Path</text>
  <rect x="1060" y="525" width="300" height="32" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="1070" y="545" font-family="Arial, sans-serif" font-size="12" fill="#999">person.name</text>
  
  <!-- Checkboxes -->
  <rect x="1060" y="580" width="16" height="16" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="1085" y="592" font-family="Arial, sans-serif" font-size="12" fill="#333">Required</text>
  
  <rect x="1060" y="610" width="16" height="16" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="1085" y="622" font-family="Arial, sans-serif" font-size="12" fill="#333">Readonly</text>
  
  <!-- Action Buttons -->
  <rect x="1060" y="650" width="140" height="35" fill="#f44336" stroke="#d32f2f" stroke-width="1" rx="4"/>
  <text x="1105" y="672" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Delete</text>
  
  <rect x="1220" y="650" width="140" height="35" fill="#ff9800" stroke="#f57c00" stroke-width="1" rx="4"/>
  <text x="1265" y="672" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Duplicate</text>
  
  <!-- Divider Line -->
  <line x1="680" y1="80" x2="680" y2="880" stroke="#ddd" stroke-width="2"/>
  
  <!-- Footer/Status Bar -->
  <rect x="20" y="900" width="1360" height="0" fill="#2c3e50"/>
</svg>