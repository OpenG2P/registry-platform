    REGISTRY_STAFF_PORTAL_API_AWE_HTTP_TIMEOUT_SECONDS: '{{ .Values.global.aweHttpTimeoutSeconds }}'
    REGISTRY_STAFF_PORTAL_API_AWE_DEFAULT_CALLBACK_URL: '{{ tpl .Values.global.aweDefaultCallbackUrl $ }}'
    REGISTRY_STAFF_PORTAL_API_AWE_CALLBACK_SECRET_ID: '{{ tpl .Values.global.aweCallbackSecretId $ }}'
    REGISTRY_STAFF_PORTAL_API_AWE_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS: '{{ .Values.global.aweWebhookTimestampToleranceSeconds }}'

    REGISTRY_STAFF_PORTAL_API_PARTNER_MGMT_API_URL: '{{ tpl .Values.global.partnerManagementApiUrl $ }}'
    REGISTRY_STAFF_PORTAL_API_PARTNER_MGMT_ADMIN_API_URL: '{{ tpl .Values.global.partnerManagementAdminApiUrl $ }}'
    REGISTRY_STAFF_PORTAL_API_PARTNER_MGMT_ADMIN_TOKEN_URL: "{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token"
    REGISTRY_STAFF_PORTAL_API_PARTNER_MGMT_ADMIN_CLIENT_ID: '{{ tpl .Values.global.pmSeedClientId $ }}'

  envVarsFrom:
    REGISTRY_STAFF_PORTAL_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_READ_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioReadonlyAccessKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_READ_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioReadonlySecretKey $ }}'
    REGISTRY_STAFF_PORTAL_API_AWE_CALLBACK_HMAC_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.aweCallbackHmacSecretName $ }}'
        key: '{{ .Values.global.aweCallbackHmacSecretKey }}'
    REGISTRY_STAFF_PORTAL_API_PARTNER_MGMT_ADMIN_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.pmSeedClientId $ }}'
        key: client_secret
        optional: true

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_STAFF_PORTAL_API_DB_USERNAME} -h ${REGISTRY_STAFF_PORTAL_API_DB_HOSTNAME} -p ${REGISTRY_STAFF_PORTAL_API_DB_PORT:-5432} -d ${REGISTRY_STAFF_PORTAL_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

  # Staff Portal API is the primary read-write FastAPI for registry staff
  # operations (registrant CRUD, lookup, search, intake validation, MinIO
  # pre-signed URLs). Worker count is now 3 (STAFF_PORTAL_NO_OF_WORKERS in
  # envVars below), reduced from 8 to make memory predictable and shift scale
  # to HPA (enabled above). Sizing mirrored from NSR (measured there): ~570Mi
  # estimated at 3 workers; search/listing spikes as result pages materialise
  # as Python objects. Request 768Mi / 1.5Gi limit — a GENEROUS runaway cap,
  # NOT a right-size (no cpu limit: CPU is compressible, a cpu limit only
  # throttles latency and never prevents OOM; memory limits protect the node
  # from a single runaway pod). ESTIMATE for 3 workers — verify with
  # `kubectl top pod` after the first rollout.
  resources:
    requests:
      cpu: 50m
      memory: 768Mi
    limits:
      memory: 1536Mi

staffUi:
  enabled: true
  nameOverride: staff-portal-ui
  hostname: '{{ tpl .Values.global.registryHostname $ }}'
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: registry.gitlab.com/openg2p/registry/registry-platform/staff-ui
    tag: "1.0.0"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  containerPort: 3000

  # Staff Portal UI is a Next.js SSR app. Node's V8 heap can balloon on cold
  # start (JIT warmup), large page pre-render, or concurrent SSR. Sizing
  # mirrored from NSR (~67Mi idle measured there): request 192Mi covers the
  # baseline with headroom; 768Mi limit is a generous cap matching typical
  # Next.js production sizing (no cpu limit — see staffApi rationale).
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 768Mi

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.global.registryHostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-staff-portal-ui'
      destinationPort: '{{ .Values.service.port }}'
      prefix: '/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: '{{ tpl .Values.global.registryHostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  # Configuration parameters
  partnerIngestUrl: 'https://partner-{{ tpl .Values.global.registryHostname $ }}/partner/ingest_data?data_model=dcivc'
  vpPresentationId: "7f3c2a91-bb84-4d1f-9a6e-41c8e5a0d9f2"
  vpPurpose: "Digital identity verification for registry onboarding"
  # Browser-facing IAM URL (Staff Portal UI login providers)
  iamPublicUrl: 'https://staff-iam.{{ .Release.Namespace }}.openg2p.org'

  envVars:
    # Per-release identifiers so two registry installs in the same namespace
    # don't share UI/audit identity. APPLICATION_MNEMONIC must equal the
    # Keycloak clientId verbatim (global.authClientId).
    APP_MNEMONIC: '{{ .Release.Name }}-ui'
    APP_URL: 'https://{{ tpl .Values.global.registryHostname $ }}'
    APPLICATION_MNEMONIC: '{{ tpl .Values.global.authClientId $ }}'
    # Allow profile/document images from MinIO pre-signed URLs in the browser CSP.
    CSP_SRC_IMG: 'self blob: data: https://{{ tpl .Values.global.minioHost $ }}'
    # Server-side calls from the Next.js Staff Portal UI pod to the Staff
    # Portal API stay inside the cluster — sibling K8s Service is named
    # "<release>-staff-portal-api" on port 80. Browser-side calls from the
    # client should use a separate NEXT_PUBLIC_* var pointing to the public
    # https://staff-<host> hostname (add when needed).
    BACKEND_API_URL: 'http://{{ .Release.Name }}-staff-portal-api'
    COOKIE_DOMAIN: '.{{ .Release.Namespace }}.openg2p.org'
    IAM_URL: '{{ tpl .Values.iamPublicUrl $ }}'
    KEYCLOAK_LOGOUT_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/logout'
    LOGIN_PROVIDER_ID: '1'
    MASTERDATA_BACKEND_API_URL: '{{ .Values.global.masterDataApiUrl }}'
    NODE_ENV: production
    PAGE_SIZE: '10'
    PARTNER_IMPORT_EXPORT_ENABLE: 'true'
    PARTNER_INGEST_URL: '{{ tpl .Values.partnerIngestUrl $ }}'
    REDIRECT_URL: 'https://{{ tpl .Values.global.registryHostname $ }}'
    VERIFY_SERVICE_URL: 'https://{{ tpl .Values.global.registryHostname $ }}/v1/verify'
    VP_CLIENT_ID: 'did:web:{{ tpl .Values.global.registryHostname $ }}:v1:verify'
    VP_PRESENTATION_ID: '{{ .Values.vpPresentationId }}'
    VP_PURPOSE: '{{ .Values.vpPurpose }}'

  envVarsFrom: {}

  startupProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

celeryBeat:
  enabled: true
  nameOverride: celery-beat-producer
  replicaCount: 1
  image:
    repository: registry.gitlab.com/openg2p/registry/registry-platform/celery
    tag: "develop"
    pullPolicy: Always

  # Celery Beat Producer is NOT just a scheduler in this chart — it also
  # does batch enqueueing (REGISTRY_CELERY_BEAT_BATCH_SIZE=2000,
  # NO_OF_TASKS_TO_PROCESS=4 above). Each tick pulls up to 2000 records,
  # holds them in memory while creating up to 4 parallel task envelopes, and
  # dispatches to Redis. Sizing mirrored from NSR (~500Mi idle measured there):
  # request 640Mi reflects the real footprint; 1.5Gi limit is a generous cap
  # (no cpu limit — see staffApi rationale). Lower BATCH_SIZE or
  # NO_OF_TASKS_TO_PROCESS if you need to shrink the per-tick memory.
  resources:
    requests:
      cpu: 20m
      memory: 640Mi
    limits:
      memory: 1536Mi

  envVars:
    REGISTRY_CELERY_BEAT_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CELERY_BEAT_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_CELERY_BEAT_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_CELERY_BEAT_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_CELERY_BEAT_CELERY_BROKER_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0
    REGISTRY_CELERY_BEAT_CELERY_BACKEND_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0

    REGISTRY_CELERY_BEAT_WORKER_QUEUE: registry_worker_queue
    REGISTRY_CELERY_BEAT_BATCH_SIZE: 2000
    REGISTRY_CELERY_BEAT_NO_OF_TASKS_TO_PROCESS: 4

    REGISTRY_CELERY_BEAT_DATA_TRANSFORMATION_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_INGEST_DATA_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_INGEST_DATA_CLASSIFICATION_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_OUTGEST_DATA_PUBLISH_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_OUTGEST_TOPIC_REGISTER_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_DEDUPLICATION_BEAT_PRODUCER_FREQUENCY: 30
    CELERY_APP: "openg2p_registry_celery_beat.main.celery_app"
    CELERY_OPTS: "worker --beat --loglevel=info --schedule=/tmp/celery-beat-schedule.db"

  envVarsFrom:
    REGISTRY_CELERY_BEAT_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - >-
      until pg_isready
      -U ${REGISTRY_CELERY_BEAT_DB_USERNAME}
      -h ${REGISTRY_CELERY_BEAT_DB_HOSTNAME}
      -p ${REGISTRY_CELERY_BEAT_DB_PORT:-5432}
      -d ${REGISTRY_CELERY_BEAT_DB_DBNAME:-registrydb};
      do sleep 3;
      done
    containerSecurityContext:
      enabled: false

  serviceAccount:
    create: false
    name: ""

celeryWorker:
  enabled: true
  nameOverride: celery-worker
  replicaCount: 1
  image:
    repository: registry.gitlab.com/openg2p/registry/registry-platform/celery
    tag: "develop"
    pullPolicy: Always

  # Celery Worker is the largest variable-load component in the chart. It
  # processes async tasks (bulk partner ingest, data transformation,
  # classification) — memory spikes well past 1Gi when crunching large CSV
  # ingests or classifying big batches (2000-row batches held in memory).
  # Sizing mirrored from NSR (~600Mi idle measured there): request 1Gi reserves
  # the real footprint so the scheduler doesn't over-pack workers onto a node;
  # 2.5Gi limit is a generous runaway cap for the worst batch peak (no cpu
  # limit — see staffApi rationale). If ingests OOM at the cap, lower
  # REGISTRY_CELERY_WORKERS_BATCH_SIZE or scale out replicaCount.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2560Mi

  envVars:
    REGISTRY_CELERY_WORKERS_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CELERY_WORKERS_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_CELERY_WORKERS_DB_PORT: 5432
    REGISTRY_CELERY_WORKERS_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_DRIVER: 'postgresql+asyncpg'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_USERNAME: '{{ .Values.global.masterDataDBUser }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_DBNAME: '{{ .Values.global.masterDataDB }}'

    REGISTRY_CELERY_WORKERS_CELERY_BROKER_URL: "redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0"
    REGISTRY_CELERY_WORKERS_CELERY_BACKEND_URL: "redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0"
    REGISTRY_CELERY_WORKERS_WORKER_QUEUE: "registry_worker_queue"

    REGISTRY_CELERY_WORKERS_BATCH_SIZE: 2000
    REGISTRY_CELERY_WORKERS_WORKER_MAX_ATTEMPTS: 5

    REGISTRY_CELERY_WORKERS_MINIO_ENDPOINT: '{{ tpl .Values.global.minioHost $ }}'
    REGISTRY_CELERY_WORKERS_MINIO_SECURE: '{{ .Values.global.minioSecure }}'
    REGISTRY_CELERY_WORKERS_MINIO_BUCKET_NAME: '{{ tpl .Values.global.defaultBucketName $ }}'
    REGISTRY_CELERY_WORKERS_TEMPLATE_BUCKET_NAME: '{{ tpl .Values.global.templateBucketName $ }}'
    REGISTRY_CELERY_WORKERS_FUNCTIONAL_ID_GENERATION_URL: '{{ tpl .Values.global.idGeneratorInternalUrl $ }}'
    REGISTRY_CELERY_WORKERS_ID_GENERATION_ALLOCATION_PATH: '/idgenerator/{id_type}/id'

    REGISTRY_CELERY_WORKERS_PARTNER_MGMT_API_URL: '{{ tpl .Values.global.partnerManagementApiUrl $ }}'
    REGISTRY_CELERY_WORKERS_PARTNER_MGMT_ADMIN_API_URL: '{{ tpl .Values.global.partnerManagementAdminApiUrl $ }}'
    REGISTRY_CELERY_WORKERS_PARTNER_MGMT_ADMIN_TOKEN_URL: "{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token"
    REGISTRY_CELERY_WORKERS_PARTNER_MGMT_ADMIN_CLIENT_ID: '{{ tpl .Values.global.pmSeedClientId $ }}'
    CELERY_APP: "openg2p_registry_celery_worker.main.celery_app"
    CELERY_OPTS: "worker -Q registry_worker_queue --loglevel=info"

  envVarsFrom:
    REGISTRY_CELERY_WORKERS_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_CELERY_WORKERS_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'
    REGISTRY_CELERY_WORKERS_MINIO_READ_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioReadonlyAccessKey $ }}'
    REGISTRY_CELERY_WORKERS_MINIO_READ_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioReadonlySecretKey $ }}'
    REGISTRY_CELERY_WORKERS_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'
    REGISTRY_CELERY_WORKERS_PARTNER_MGMT_ADMIN_CLIENT_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.pmSeedClientId $ }}'
        key: client_secret
        optional: true

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - >-
      until pg_isready
      -U ${REGISTRY_CELERY_WORKERS_DB_USERNAME}
      -h ${REGISTRY_CELERY_WORKERS_DB_HOSTNAME}
      -p ${REGISTRY_CELERY_WORKERS_DB_PORT:-5432}
      -d ${REGISTRY_CELERY_WORKERS_DB_DBNAME:-registrydb};
      do sleep 3;
      done
    containerSecurityContext:
      enabled: false

  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true
  serviceAccount:
    create: false
    name: ""

