# ==========================================================================
# Agent Portal API — verifiable credential issuance at an agent counter.
#
# OFF BY DEFAULT, twice over:
#   agentPortalApi.enabled            — deploy the service at all
#   agentPortalApi.vcIssuance.enabled — mount the issuance routes inside it
# With both false the chart renders exactly what it did before this component
# existed, so an existing registry can take this chart version with no change
# in behaviour.
#
# Agents are a DISTINCT audience from staff: their own Keycloak realm
# (`agent`), their own portal, their own permission. A staff token grants
# nothing here.
#
# Turning it on additionally needs, from the MANIFESTATION (NSR, Farmer
# Registry, …) because the claim fields differ per registry:
#   * a read-only VC view keyed on internal_record_id (see vcDefinitions[].view)
#   * its vcDefinitions entries
#   * the SVG card design (svgConfigMap)
# and, from the environment: the `agent` realm, and an eSignet provider row for
# registrant authentication.
# ==========================================================================
agentPortalApi:
  enabled: false
  nameOverride: agent-portal-api
  hostname: 'agent-{{ tpl .Values.global.registryHostname $ }}'
  replicaCount: 1

  # The capability switch inside the service. Kept separate from `enabled` so a
  # deployment can run the agent portal without credential issuance.
  vcIssuance:
    enabled: false
    # How long a completed beneficiary authentication may authorise an issuance,
    # measured from its completion. Deliberately short: the beneficiary is
    # standing at the counter. This is VC policy and is independent of the
    # (much longer) validity the authentication record carries for other users
    # of the same subsystem.
    authWindowSeconds: 300
    # Register whose records may be issued credentials. Phase 1 issues to an
    # individual; set this to that register's id.
    registerId: ""
    # Registrant-authentication provider to use (adapter_name = esignet). Empty
    # means "the first active provider on the register".
    # Created by the bootstrap Job below, and read by the API at issuance —
    # both derive it from here, so they cannot drift.
    authProviderId: 'esignet-{{ .Release.Name }}'
    # Register this registry's credential_configs with Certify on install and
    # upgrade. Certify can only issue a type it already knows, so leaving this
    # off means every issuance fails on an unknown credential_configuration_id
    # — turn it off only when the configs are managed by hand.
    registerEnabled: true
    registerImage: curlimages/curl:8.11.0

    # ── One-time bootstrap of the beneficiary-authentication chain ───────────
    # Creates the four pieces of state that VC issuance needs and that nothing
    # else creates: the eSignet OIDC client (with a freshly generated keypair),
    # this register's eSignet provider row, the IAM application/permission/role
    # that authorises issuance, and the register's
    # requires_registrant_authentication flag.
    #
    # It writes into eSignet's and IAM's schemas as well as the registry's.
    # That is why it is a switch. eSignet's client-mgmt API is gated behind an
    # OAuth scope (add_oidc_client) an unattended job cannot obtain, so seeding
    # the row is the only route; turn this off where another system owns that
    # state and do the four steps yourself.
    #
    # Idempotent, and it never rotates a live key: if the provider row already
    # carries a private key the client and provider are left untouched, because
    # eSignet holds the matching public half and replacing one side silently
    # breaks every authentication.
    bootstrap:
      enabled: true
      backoffLimit: 3
      # Key generation needs openssl, which the postgres client image does not
      # carry — hence a separate init container. python:3.12-slim is used
      # because it ships the openssl CLI; alpine/openssl does not resolve on
      # Docker Hub, and Bitnami's images are no longer freely published.
      keygenImage: python:3.12-slim
      psqlImage: postgres:16-alpine
      esignet:
        # Public host, used to derive the authorize/token/userinfo endpoints and
        # the issuer the provider row trusts.
        hostname: 'esignet.{{ .Release.Namespace }}.openg2p.org'
        # Per-release so two registries in one namespace get their own eSignet
        # client and their own keypair.
        clientId: '{{ .Release.Name }}-registry-vc'
        # Authentication factor eSignet should ask the beneficiary for.
        # mosip:idp:acr:generated-code = OTP, :biometrics = fingerprint/iris.
        acrValues: 'mosip:idp:acr:generated-code'
        dbName: mosip_esignet
        dbUser: esignetuser
        dbSecret: esignet-db-user
        dbSecretKey: esignet-db-user-password
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi

  # One entry per issuable credential type. The base platform ships NONE: the
  # fields differ per registry, so the concrete list belongs to the
  # manifestation's chart. Shape:
  #
  #   - config_id: OpenG2PBeneficiaryCredential      # Certify credential_config id
  #     credential_types: ["VerifiableCredential", "OpenG2PBeneficiaryCredential"]
  #     view: beneficiary_vc_view                    # keyed on internal_record_id
  #     claim_columns: ["functionalRecordId", "fullName", "dateOfBirth"]
  #     svg_template: beneficiary-card.svg
  #     display_name: "Beneficiary Credential"
  #     # Registered into Certify by the credential-config-register Job. The
  #     # issuer (DID + key) is added from global.vcIssuer — do not repeat it.
  #     certifyConfig:
  #       credentialConfigKeyId: OpenG2PBeneficiaryCredential
  #       credentialFormat: ldp_vc
  #       credentialTypes: ["VerifiableCredential", "OpenG2PBeneficiaryCredential"]
  #       contextURLs: ["https://www.w3.org/2018/credentials/v1"]
  #       scope: openg2p_beneficiary_vc_ldp
  #       displayOrder: ["functionalRecordId", "fullName", "dateOfBirth"]
  #       metaDataDisplay: [{ name: "OpenG2P Beneficiary Credential", locale: en }]
  #       credentialSubjectDefinition: { ... }
  #       # Authored as READABLE JSON; the Job base64-encodes it for Certify.
  #       vcTemplateJson: |
  #         { "@context": [...], "issuer": "${_issuer}", ... }
  vcDefinitions: []

  # ConfigMap holding the SVG card designs, mounted at /app/pdf-templates. The
  # manifestation builds it from real .svg files kept in its own repo, so a
  # designer can change the card without touching code or this chart.
  svgConfigMap: ""

  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: registry.gitlab.com/openg2p/registry/registry-platform/agent-portal-api
    tag: "1.0"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: ""
      gateway: "internal"
      destination: '{{ .Release.Name }}-agent-portal-api'
      destinationPort: '{{ .Values.agentPortalApi.service.port }}'
      prefix: '{{ .Values.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: ""
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  envVars:
    REGISTRY_AGENT_PORTAL_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_AGENT_PORTAL_API_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_AGENT_PORTAL_API_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_AGENT_PORTAL_API_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_AGENT_PORTAL_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'

    # Feature switch, read by the service at startup.
    REGISTRY_AGENT_PORTAL_API_VC_ISSUANCE_ENABLED: '{{ .Values.vcIssuance.enabled }}'
    REGISTRY_AGENT_PORTAL_API_VC_AUTH_WINDOW_SECONDS: '{{ .Values.vcIssuance.authWindowSeconds }}'
    REGISTRY_AGENT_PORTAL_API_VC_REGISTER_ID: '{{ .Values.vcIssuance.registerId }}'
    REGISTRY_AGENT_PORTAL_API_VC_AUTH_PROVIDER_ID: '{{ tpl .Values.vcIssuance.authProviderId $ }}'
    REGISTRY_AGENT_PORTAL_API_VC_DEFINITIONS: '{{ .Values.vcDefinitions | toJson }}'

    # Inji Certify, reached in-cluster. Certify is never exposed publicly for
    # issuance; this service is its only client.
    # tpl'd explicitly: each env value gets exactly ONE tpl pass, and plain
    # indirection returns the global's raw text without re-evaluating it — so a
    # templated global (the audience carries .Release.Namespace) would reach the
    # pod as literal template source.
    REGISTRY_AGENT_PORTAL_API_CERTIFY_BASE_URL: '{{ tpl .Values.global.certifyBaseUrl $ }}'
    REGISTRY_AGENT_PORTAL_API_CERTIFY_AUDIENCE: '{{ tpl .Values.global.certifyAudience $ }}'

    REGISTRY_AGENT_PORTAL_API_SVG_TEMPLATE_DIR: /app/pdf-templates
    REGISTRY_AGENT_PORTAL_API_PDF_TITLE: '{{ .Values.pdf.title }}'
    REGISTRY_AGENT_PORTAL_API_PDF_ISSUER_NAME: '{{ .Values.pdf.issuerName }}'

    # IAM — the `agent` realm client this API validates tokens against.
    REGISTRY_AGENT_PORTAL_API_KEYCLOAK_CLIENT_ID: '{{ tpl .Values.global.agentKeycloakClientId $ }}'
    # Audit Manager. Issuance is the most consequential action here, so this is
    # on by default; it still no-ops if the URL is empty.
    REGISTRY_AGENT_PORTAL_API_AUDIT_ENABLED: '{{ .Values.global.auditEnabled }}'
    REGISTRY_AGENT_PORTAL_API_AUDIT_MANAGER_URL: '{{ tpl .Values.global.auditManagerUrl $ }}'
    REGISTRY_AGENT_PORTAL_API_AUDIT_ANONYMOUS_FAILURES: '{{ .Values.global.auditAnonymousFailures }}'
    # ── Registrant-authentication session store ───────────────────────────
    # The eSignet transaction (state/nonce/PKCE verifier + the record context)
    # is created when authentication STARTS and read back when eSignet
    # redirects to the callback. Those two halves do not run in the same pod:
    # the agent portal starts it, but oauth_callback_url points at the STAFF
    # API, which is where eSignet lands. With the default in-process store the
    # callback pod has never seen the state and the authentication always
    # fails. It must therefore be a store both pods share.
    #
    # The code's own default is redis://localhost:6379/0, which resolves to
    # nothing inside either pod, so this cannot be left unset.
    REGISTRY_CORE_REGISTRANT_AUTH_SESSION_STORE_BACKEND: 'redis'
    REGISTRY_CORE_REGISTRANT_AUTH_REDIS_URL: 'redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0'
    REGISTRY_AGENT_PORTAL_API_AUTH_PROVIDER_API_URL: '{{ tpl (default .Values.global.iamServiceUrl .Values.global.agentAuthProviderApiUrl) $ }}'
  envVarsFrom:
    REGISTRY_AGENT_PORTAL_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'

  pdf:
    title: "Beneficiary Credential"
    issuerName: "OpenG2P"

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_AGENT_PORTAL_API_DB_USERNAME} -h ${REGISTRY_AGENT_PORTAL_API_DB_HOSTNAME} -p ${REGISTRY_AGENT_PORTAL_API_DB_PORT:-5432} -d ${REGISTRY_AGENT_PORTAL_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

  # Same FastAPI profile as the Beneficiary Portal API (3 workers). Rendering a
  # PDF is short-lived and CPU-bound; no cpu limit (see staffApi).
  resources:
    requests:
      cpu: 50m
      memory: 640Mi
    limits:
      memory: 1280Mi

staffApi:
  enabled: true
  nameOverride: staff-portal-api
  hostname: 'staff-{{ tpl .Values.global.registryHostname $ }}'
  replicaCount: 1
  # HPA enabled: with 3 workers per pod (below), scale is horizontal. CPU-based
  # only — memory-based HPA is disabled (null target) because Python RSS does
  # not shrink after a spike, so a memory target would scale up and never scale
  # back down. Raise minReplicas to 2+ for HA in production; tune targetCPU and
  # maxReplicas against a load test.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: registry.gitlab.com/openg2p/registry/registry-platform/staff-api
    tag: "develop"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      # Hostname inlined — see comment under partnerApi.istio for rationale.
      host: 'staff-{{ tpl .Values.global.registryHostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-staff-portal-api'
      destinationPort: '{{ .Values.staffApi.service.port }}'
      prefix: '{{ .Values.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: 'staff-{{ tpl .Values.global.registryHostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  envVars:
    # gunicorn/uvicorn worker count (overrides the image default). Fewer workers
    # = smaller, more predictable per-pod memory; scale horizontally via the HPA
    # above rather than many workers per pod. Bump this per-environment if
    # concurrent blocking-DB throughput needs it — no image rebuild required.
    STAFF_PORTAL_NO_OF_WORKERS: "3"
    REGISTRY_STAFF_PORTAL_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_STAFF_PORTAL_API_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_STAFF_PORTAL_API_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_STAFF_PORTAL_API_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_DRIVER: 'postgresql+asyncpg'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_USERNAME: '{{ .Values.global.masterDataDBUser }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_DBNAME: '{{ .Values.global.masterDataDB }}'

    REGISTRY_STAFF_PORTAL_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'

    REGISTRY_STAFF_PORTAL_API_AUTH_PROVIDER_API_URL: '{{ .Values.global.iamServiceUrl }}'
    REGISTRY_STAFF_PORTAL_API_AUTH_REDIS_URL: 'redis://{{ tpl .Values.global.authRedisInstallationName $ }}-master:6379/0'
    # ── Registrant-authentication session store ───────────────────────────
    # The eSignet transaction (state/nonce/PKCE verifier + the record context)
    # is created when authentication STARTS and read back when eSignet
    # redirects to the callback. Those two halves do not run in the same pod:
    # the agent portal starts it, but oauth_callback_url points at the STAFF
    # API, which is where eSignet lands. With the default in-process store the
    # callback pod has never seen the state and the authentication always
    # fails. It must therefore be a store both pods share.
    #
    # The code's own default is redis://localhost:6379/0, which resolves to
    # nothing inside either pod, so this cannot be left unset.
    REGISTRY_CORE_REGISTRANT_AUTH_SESSION_STORE_BACKEND: 'redis'
    REGISTRY_CORE_REGISTRANT_AUTH_REDIS_URL: 'redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0'
    REGISTRY_STAFF_PORTAL_API_AUTH_REFRESH_TOKEN_TTL_SECONDS: '{{ .Values.global.authRefreshTokenTtlSeconds }}'
    REGISTRY_STAFF_PORTAL_API_CSRF_ENABLED: '{{ .Values.global.csrfEnabled }}'
    REGISTRY_STAFF_PORTAL_API_KEYCLOAK_CLIENT_ID: '{{ tpl .Values.global.authClientId $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_ENDPOINT: '{{ tpl .Values.global.minioHost $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_SECURE: '{{ .Values.global.minioSecure }}'
    # Record images (incl. db-seed uploads) live in documentsBucketName; this must
    # match so staff-portal presigned record-image URLs resolve.
    REGISTRY_STAFF_PORTAL_API_MINIO_BUCKET_NAME: '{{ tpl .Values.global.documentsBucketName $ }}'
    REGISTRY_STAFF_PORTAL_API_TEMPLATE_BUCKET_NAME: '{{ tpl .Values.global.templateBucketName $ }}'

    # OpenG2P Audit Manager integration. No-op unless both AUDIT_ENABLED=true
    # and AUDIT_MANAGER_URL are set (controlled via global.auditEnabled and
    # global.auditManagerUrl). Safe to leave wired in older images that lack
    # the AuditMiddleware — env vars are simply ignored there.
    REGISTRY_STAFF_PORTAL_API_AUDIT_ENABLED: '{{ .Values.global.auditEnabled }}'
    REGISTRY_STAFF_PORTAL_API_AUDIT_MANAGER_URL: '{{ .Values.global.auditManagerUrl }}'
    REGISTRY_STAFF_PORTAL_API_AUDIT_ANONYMOUS_FAILURES: '{{ .Values.global.auditAnonymousFailures }}'

    REGISTRY_STAFF_PORTAL_API_AWE_ENABLED: '{{ .Values.global.aweEnabled }}'
    REGISTRY_STAFF_PORTAL_API_AWE_BASE_URL: '{{ tpl .Values.global.aweBaseUrl $ }}'
    REGISTRY_STAFF_PORTAL_API_AWE_HTTP_TIMEOUT_SECONDS: '{{ .Values.global.aweHttpTimeoutSeconds }}'
    REGISTRY_STAFF_PORTAL_API_AWE_DEFAULT_CALLBACK_URL: '{{ tpl .Values.global.aweDefaultCallbackUrl $ }}'
    REGISTRY_STAFF_PORTAL_API_AWE_CALLBACK_SECRET_ID: '{{ tpl .Values.global.aweCallbackSecretId $ }}'
    REGISTRY_STAFF_PORTAL_API_AWE_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS: '{{ .Values.global.aweWebhookTimestampToleranceSeconds }}'

  envVarsFrom:
    REGISTRY_STAFF_PORTAL_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MASTER_DATA_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_READ_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioReadonlyAccessKey $ }}'
    REGISTRY_STAFF_PORTAL_API_MINIO_READ_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioReadonlySecretKey $ }}'
    REGISTRY_STAFF_PORTAL_API_AWE_CALLBACK_HMAC_SECRET:
      secretKeyRef:
        name: '{{ tpl .Values.global.aweCallbackHmacSecretName $ }}'
        key: '{{ .Values.global.aweCallbackHmacSecretKey }}'

  startupProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /ping
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - 'until pg_isready -U ${REGISTRY_STAFF_PORTAL_API_DB_USERNAME} -h ${REGISTRY_STAFF_PORTAL_API_DB_HOSTNAME} -p ${REGISTRY_STAFF_PORTAL_API_DB_PORT:-5432} -d ${REGISTRY_STAFF_PORTAL_API_DB_DBNAME:-registrydb}; do sleep 3; done'
    containerSecurityContext:
      enabled: false

  containerPort: 8000

  # Staff Portal API is the primary read-write FastAPI for registry staff
  # operations (registrant CRUD, lookup, search, intake validation, MinIO
  # pre-signed URLs). Worker count is now 3 (STAFF_PORTAL_NO_OF_WORKERS in
  # envVars below), reduced from 8 to make memory predictable and shift scale
  # to HPA (enabled above). Sizing mirrored from NSR (measured there): ~570Mi
  # estimated at 3 workers; search/listing spikes as result pages materialise
  # as Python objects. Request 768Mi / 1.5Gi limit — a GENEROUS runaway cap,
  # NOT a right-size (no cpu limit: CPU is compressible, a cpu limit only
  # throttles latency and never prevents OOM; memory limits protect the node
  # from a single runaway pod). ESTIMATE for 3 workers — verify with
  # `kubectl top pod` after the first rollout.
  resources:
    requests:
      cpu: 50m
      memory: 768Mi
    limits:
      memory: 1536Mi

staffUi:
  enabled: true
  nameOverride: staff-portal-ui
  hostname: '{{ tpl .Values.global.registryHostname $ }}'
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: registry.gitlab.com/openg2p/registry/registry-platform/staff-ui
    tag: "1.0.0"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  containerPort: 3000

  # Staff Portal UI is a Next.js SSR app. Node's V8 heap can balloon on cold
  # start (JIT warmup), large page pre-render, or concurrent SSR. Sizing
  # mirrored from NSR (~67Mi idle measured there): request 192Mi covers the
  # baseline with headroom; 768Mi limit is a generous cap matching typical
  # Next.js production sizing (no cpu limit — see staffApi rationale).
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 768Mi

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.global.registryHostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-staff-portal-ui'
      destinationPort: '{{ .Values.service.port }}'
      prefix: '/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: '{{ tpl .Values.global.registryHostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  # Configuration parameters
  partnerIngestUrl: 'https://partner-{{ tpl .Values.global.registryHostname $ }}/partner/ingest_data?data_model=dcivc'
  vpPresentationId: "7f3c2a91-bb84-4d1f-9a6e-41c8e5a0d9f2"
  vpPurpose: "Digital identity verification for registry onboarding"
  # Browser-facing IAM URL (Staff Portal UI login providers)
  iamPublicUrl: 'https://staff-iam.{{ .Release.Namespace }}.openg2p.org'

  envVars:
    # Per-release identifiers so two registry installs in the same namespace
    # don't share UI/audit identity. APPLICATION_MNEMONIC must equal the
    # Keycloak clientId verbatim (global.authClientId).
    APP_MNEMONIC: '{{ .Release.Name }}-ui'
    APP_URL: 'https://{{ tpl .Values.global.registryHostname $ }}'
    APPLICATION_MNEMONIC: '{{ tpl .Values.global.authClientId $ }}'
    # Allow profile/document images from MinIO pre-signed URLs in the browser CSP.
    CSP_SRC_IMG: 'self blob: data: https://{{ tpl .Values.global.minioHost $ }}'
    # Server-side calls from the Next.js Staff Portal UI pod to the Staff
    # Portal API stay inside the cluster — sibling K8s Service is named
    # "<release>-staff-portal-api" on port 80. Browser-side calls from the
    # client should use a separate NEXT_PUBLIC_* var pointing to the public
    # https://staff-<host> hostname (add when needed).
    BACKEND_API_URL: 'http://{{ .Release.Name }}-staff-portal-api'
    COOKIE_DOMAIN: '.{{ .Release.Namespace }}.openg2p.org'
    IAM_URL: '{{ tpl .Values.iamPublicUrl $ }}'
    KEYCLOAK_LOGOUT_URL: '{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/logout'
    LOGIN_PROVIDER_ID: '1'
    MASTERDATA_BACKEND_API_URL: '{{ .Values.global.masterDataApiUrl }}'
    NODE_ENV: production
    PAGE_SIZE: '10'
    PARTNER_IMPORT_EXPORT_ENABLE: 'true'
    PARTNER_INGEST_URL: '{{ tpl .Values.partnerIngestUrl $ }}'
    REDIRECT_URL: 'https://{{ tpl .Values.global.registryHostname $ }}'
    VERIFY_SERVICE_URL: 'https://{{ tpl .Values.global.registryHostname $ }}/v1/verify'
    VP_CLIENT_ID: 'did:web:{{ tpl .Values.global.registryHostname $ }}:v1:verify'
    VP_PRESENTATION_ID: '{{ .Values.vpPresentationId }}'
    VP_PURPOSE: '{{ .Values.vpPurpose }}'

  envVarsFrom: {}

  startupProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

# ==========================================================================
# Agent Portal UI — the reference web client for VC issuance.
#
# A thin SPA over the Agent Portal API: find the beneficiary, have them
# authenticate at eSignet, download the printable credential. Off by default,
# like the API it talks to.
#
# One image serves every environment: /config.json is replaced at deploy time
# by the ConfigMap in templates/agent-ui/config-configmap.yaml.
# ==========================================================================

agentPortalUi:
  enabled: false
  nameOverride: agent-portal-ui
  hostname: '{{ tpl .Values.global.agentPortalHostname $ }}'
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: registry.gitlab.com/openg2p/registry/registry-platform/agent-ui
    tag: "1.0.0"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  # nginx-unprivileged, which listens on 8080 — NOT 3000. This block was modelled
  # on staffUi, a Next.js app; leaving its port here pointed every probe at a
  # port nothing listens on, so the pod served fine and was restarted anyway.
  containerPort: 8080

  # Staff Portal UI is a Next.js SSR app. Node's V8 heap can balloon on cold
  # start (JIT warmup), large page pre-render, or concurrent SSR. Sizing
  # mirrored from NSR (~67Mi idle measured there): request 192Mi covers the
  # baseline with headroom; 768Mi limit is a generous cap matching typical
  # Next.js production sizing (no cpu limit — see staffApi rationale).
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      memory: 768Mi

  istio:
    enabled: true
    virtualservice:
      enabled: true
      host: '{{ tpl .Values.global.agentPortalHostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-agent-portal-ui'
      destinationPort: '{{ .Values.service.port }}'
      prefix: '/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: '{{ tpl .Values.global.agentPortalHostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  # The agent UI is a static SPA served by nginx: it takes NO build-time or
  # pod env configuration. Everything it needs (Keycloak url/realm/clientId)
  # is served at runtime from /config.json, rendered by
  # templates/agent-ui/config-configmap.yaml, which is what lets one image
  # serve every environment. Calls to /agent_portal/ are proxied in-cluster by
  # nginx.conf, so the SPA uses same-origin URLs and needs no API hostname.
  envVars:
    # Consumed by envsubst in the image's nginx template at container start.
    # The SPA is served an empty apiBaseUrl and so calls its own origin, and
    # nginx here is what forwards /agent_portal/ to the API -- the API lives on
    # a different host, so nothing else rewrites those paths. Must be the real
    # Service: release-prefixed, port 80.
    AGENT_API_UPSTREAM: '{{ .Release.Name }}-agent-portal-api:80'

  envVarsFrom: {}

  startupProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 30
    successThreshold: 1
  livenessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1
  readinessProbe:
    enabled: true
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 0
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
    successThreshold: 1

celeryBeat:
  enabled: true
  nameOverride: celery-beat-producer
  replicaCount: 1
  image:
    repository: registry.gitlab.com/openg2p/registry/registry-platform/celery
    tag: "develop"
    pullPolicy: Always

  # Celery Beat Producer is NOT just a scheduler in this chart — it also
  # does batch enqueueing (REGISTRY_CELERY_BEAT_BATCH_SIZE=2000,
  # NO_OF_TASKS_TO_PROCESS=4 above). Each tick pulls up to 2000 records,
  # holds them in memory while creating up to 4 parallel task envelopes, and
  # dispatches to Redis. Sizing mirrored from NSR (~500Mi idle measured there):
  # request 640Mi reflects the real footprint; 1.5Gi limit is a generous cap
  # (no cpu limit — see staffApi rationale). Lower BATCH_SIZE or
  # NO_OF_TASKS_TO_PROCESS if you need to shrink the per-tick memory.
  resources:
    requests:
      cpu: 20m
      memory: 640Mi
    limits:
      memory: 1536Mi

  envVars:
    REGISTRY_CELERY_BEAT_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CELERY_BEAT_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_CELERY_BEAT_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_CELERY_BEAT_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_CELERY_BEAT_CELERY_BROKER_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0
    REGISTRY_CELERY_BEAT_CELERY_BACKEND_URL: redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0

    REGISTRY_CELERY_BEAT_WORKER_QUEUE: registry_worker_queue
    REGISTRY_CELERY_BEAT_BATCH_SIZE: 2000
    REGISTRY_CELERY_BEAT_NO_OF_TASKS_TO_PROCESS: 4

    REGISTRY_CELERY_BEAT_DATA_TRANSFORMATION_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_INGEST_DATA_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_INGEST_DATA_CLASSIFICATION_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_OUTGEST_DATA_PUBLISH_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_OUTGEST_TOPIC_REGISTER_BEAT_PRODUCER_FREQUENCY: 20
    REGISTRY_CELERY_BEAT_DEDUPLICATION_BEAT_PRODUCER_FREQUENCY: 30
    CELERY_APP: "openg2p_registry_celery_beat.main.celery_app"
    CELERY_OPTS: "worker --beat --loglevel=info --schedule=/tmp/celery-beat-schedule.db"

  envVarsFrom:
    REGISTRY_CELERY_BEAT_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - >-
      until pg_isready
      -U ${REGISTRY_CELERY_BEAT_DB_USERNAME}
      -h ${REGISTRY_CELERY_BEAT_DB_HOSTNAME}
      -p ${REGISTRY_CELERY_BEAT_DB_PORT:-5432}
      -d ${REGISTRY_CELERY_BEAT_DB_DBNAME:-registrydb};
      do sleep 3;
      done
    containerSecurityContext:
      enabled: false

  serviceAccount:
    create: false
    name: ""

celeryWorker:
  enabled: true
  nameOverride: celery-worker
  replicaCount: 1
  image:
    repository: registry.gitlab.com/openg2p/registry/registry-platform/celery
    tag: "develop"
    pullPolicy: Always

  # Celery Worker is the largest variable-load component in the chart. It
  # processes async tasks (bulk partner ingest, data transformation,
  # classification) — memory spikes well past 1Gi when crunching large CSV
  # ingests or classifying big batches (2000-row batches held in memory).
  # Sizing mirrored from NSR (~600Mi idle measured there): request 1Gi reserves
  # the real footprint so the scheduler doesn't over-pack workers onto a node;
  # 2.5Gi limit is a generous runaway cap for the worst batch peak (no cpu
  # limit — see staffApi rationale). If ingests OOM at the cap, lower
  # REGISTRY_CELERY_WORKERS_BATCH_SIZE or scale out replicaCount.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 2560Mi

  envVars:
    REGISTRY_CELERY_WORKERS_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CELERY_WORKERS_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_CELERY_WORKERS_DB_PORT: 5432
    REGISTRY_CELERY_WORKERS_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'

    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_DRIVER: 'postgresql+asyncpg'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_USERNAME: '{{ .Values.global.masterDataDBUser }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_DBNAME: '{{ .Values.global.masterDataDB }}'

    REGISTRY_CELERY_WORKERS_CELERY_BROKER_URL: "redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0"
    REGISTRY_CELERY_WORKERS_CELERY_BACKEND_URL: "redis://{{ tpl .Values.global.redisInstallationName $ }}:6379/0"
    REGISTRY_CELERY_WORKERS_WORKER_QUEUE: "registry_worker_queue"

    REGISTRY_CELERY_WORKERS_BATCH_SIZE: 2000
    REGISTRY_CELERY_WORKERS_WORKER_MAX_ATTEMPTS: 5

    REGISTRY_CELERY_WORKERS_MINIO_ENDPOINT: '{{ tpl .Values.global.minioHost $ }}'
    REGISTRY_CELERY_WORKERS_MINIO_SECURE: '{{ .Values.global.minioSecure }}'
    REGISTRY_CELERY_WORKERS_MINIO_BUCKET_NAME: '{{ tpl .Values.global.defaultBucketName $ }}'
    REGISTRY_CELERY_WORKERS_TEMPLATE_BUCKET_NAME: '{{ tpl .Values.global.templateBucketName $ }}'
    REGISTRY_CELERY_WORKERS_FUNCTIONAL_ID_GENERATION_URL: '{{ tpl .Values.global.idGeneratorInternalUrl $ }}'
    REGISTRY_CELERY_WORKERS_ID_GENERATION_ALLOCATION_PATH: '/idgenerator/{id_type}/id'
    CELERY_APP: "openg2p_registry_celery_worker.main.celery_app"
    CELERY_OPTS: "worker -Q registry_worker_queue --loglevel=info"

  envVarsFrom:
    REGISTRY_CELERY_WORKERS_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_CELERY_WORKERS_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'
    REGISTRY_CELERY_WORKERS_MINIO_READ_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioReadonlyAccessKey $ }}'
    REGISTRY_CELERY_WORKERS_MINIO_READ_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioReadonlySecretKey $ }}'
    REGISTRY_CELERY_WORKERS_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_CELERY_WORKERS_MASTER_DATA_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'

  postgresCheckerInit:
    enabled: true
    image:
      repository: jbergknoff/postgresql-client
      tag: latest
      pullPolicy: IfNotPresent
    command:
    - 'sh'
    args:
    - '-c'
    - >-
      until pg_isready
      -U ${REGISTRY_CELERY_WORKERS_DB_USERNAME}
      -h ${REGISTRY_CELERY_WORKERS_DB_HOSTNAME}
      -p ${REGISTRY_CELERY_WORKERS_DB_PORT:-5432}
      -d ${REGISTRY_CELERY_WORKERS_DB_DBNAME:-registrydb};
      do sleep 3;
      done
    containerSecurityContext:
      enabled: false

  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true
  serviceAccount:
    create: false
    name: ""

redis:
  enabled: true
  architecture: standalone
  master:
    persistence:
      enabled: false
  auth:
    enabled: false

keycloak-init:
  enabled: true
  keycloak:
    # Internal URL to reach Keycloak within the namespace
    url: 'http://commons-keycloak:80'
    user: 'admin'
    password: ''
    # Points to the Keycloak chart's auto-created admin secret (<commons-release-name>-keycloak)
    existingSecret: 'commons-keycloak'
    existingSecretKey: 'admin-password'
  suffix: '{{ .Release.Namespace }}'
  realms:
    # ── The `agent` realm ──────────────────────────────────────────────────
    # Created alongside `staff` and for the same reason: without it the agent
    # portal has nothing to authenticate against, and neither the agent UI nor
    # the agent API can be used at all. keycloak-init is idempotent, so this is
    # safe to re-run and safe if the realm already exists.
    #
    # It is created even when the agent portal is switched off — `realms` is
    # static YAML and cannot be made conditional on agentPortalApi.enabled. An
    # unused realm holding two clients costs far less than a feature that
    # deploys cleanly and then silently cannot log anyone in.
    agent:
      clients:
        # Confidential client the agent logs in through, and whose client roles
        # carry the issuance permission. Per-release, exactly like the staff
        # client, so two registries in one namespace get their own agent client
        # and their own client_secret Secret.
        #
        # This does NOT have to equal the IAM chart's
        # IAM_AGENT_KEYCLOAK_CLIENT_ID: that governs calls made TO
        # iam-agent-portal-api, which this flow never makes -- permissions
        # resolve against the IAM *staff* API, and token validation finds the
        # provider by ISSUER (the realm), not by client id.
        - clientId: '{{ .Release.Name }}-agent-portal'
          name: OpenG2P Agent Portal
          # Host-scoped, never a bare "*" — same rule as the staff client.
          redirectUris:
            - 'https://{{ tpl .Values.global.agentPortalHostname $ }}/*'
          clientRoles:
            # The single capability an agent has: issue a credential.
            - "register:issue_credential"
        # Public browser client for the agent SPA. Must equal
        # global.agentKeycloakUiClientId, which the UI reads from config.json.
        - clientId: '{{ .Release.Name }}-agent-portal-ui'
          name: OpenG2P Agent Portal UI
          publicClient: true
          redirectUris:
            - 'https://{{ tpl .Values.global.agentPortalHostname $ }}/*'
          # The SAME role is defined here as on agent-portal, because the two
          # sides read it from different places: the API checks
          # resource_access['agent-portal'], while the SPA reads
          # resource_access['agent-portal-ui'] to decide whether to offer the
          # issue action. With it on only one client the agent logs in fine and
          # then finds issuance greyed out (or is refused at the API).
          clientRoles:
            - "register:issue_credential"
          # Puts 'agent-portal' in the aud of tokens minted for the SPA, so the
          # API's audience check passes on a token the browser obtained.
          protocolMappers:
            - name: agent-portal-audience
              protocol: openid-connect
              protocolMapper: oidc-audience-mapper
              config:
                included.client.audience: '{{ .Release.Name }}-agent-portal'
                access.token.claim: 'true'
      users:
        # Demo agent, mirroring the demo staff users above. Real deployments
        # create their own agents and should change this password.
        - username: agent
          firstName: Field
          lastName: Agent
          email: agent@email.com
          password: '{{ .Values.global.agentUserPassword }}'
          enabled: true
          clientRoleMappings:
            '{{ .Release.Name }}-agent-portal':
              - "register:issue_credential"
            '{{ .Release.Name }}-agent-portal-ui':
              - "register:issue_credential"
    staff:
      clients:
        # Per-release client inside the shared `staff` realm. clientId is
        # templated so two registry installs in the same namespace each get
        # their own OIDC client (and their own client_secret Secret named
        # after the clientId — see global.authClientSecret above).
        - clientId: '{{ .Release.Name }}-staff-portal'
          name: Registry Staff Portal
          # Host-scoped redirect URIs — restricted to the Staff Portal UI's
          # public hostname. Covers all paths under it (root, OIDC callback,
          # post-login landing). NEVER use a bare "*" — it allows token
          # redirects to arbitrary hosts and is a known OIDC vulnerability.
          redirectUris:
            - 'https://{{ tpl .Values.global.registryHostname $ }}/*'
          clientRoles:
            # --- Operations roles ---
            - "Intake Officer"
            - "Intake Validator"
            - "Data Editor"
            - "Data Validator"
            - "Data Supervisor"
            - "Integration Manager"
            - "Operations Administrator"
            # --- Configuration roles ---
            - "Schema Designer"
            - "Integration Specialist"
            - "Reference Data Specialist"
            - "Technical Administrator"
      users:
        # IMPORTANT: It is assumed that admin has already been created as part
        # of commons layer
        - username: admin
          clientRoleMappings:
            # Key must equal the per-release clientId above. keycloak-init
            # renders this whole block through `tpl`, so the Go-template
            # expression in the YAML key is resolved at install time.
            '{{ .Release.Name }}-staff-portal':
              - "Operations Administrator"
              - "Technical Administrator"
        - username: alex.carter
