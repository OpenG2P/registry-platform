idgenerator:
  enabled: true
  global:
    idGeneratorDB: '{{ printf "%s_idgenerator" .Release.Name | replace "-" "_" }}'
    idGeneratorDBUser: '{{ printf "%s_idgenerator_user" .Release.Name | replace "-" "_" }}'
    idGeneratorDBSecret: '{{ .Release.Name }}-idgenerator'
    idGeneratorDBUserPasswordKey: '{{ .Release.Name }}-idgenerator-db-user'
  postgres-init:
    enabled: true
    nameOverride: idgen-pg-init
  idGenerator:
    enabled: true
    appConfig:
      # Functional-ID pools, one per register. These MUST match the registers the
      # deployed extension actually defines — this chart's default is the
      # REFERENCE registry (Individual + Household). A variant registry overrides
      # this block with its own register names.
      #
      # NB Helm MERGES maps from a parent chart and a `null` in a parent's
      # values.yaml does NOT delete a subchart default, so a variant that names
      # different registers inherits these too and provisions unused pools. Keep
      # this list to what the reference registry needs.
      idTypes:
        individual:
          idLength: 12
        household:
          idLength: 10
      sequenceLimit: 3
      repeatingLimit: 2
      repeatingBlockLimit: 2
      conjugativeEvenDigitsLimit: 3
      digitsGroupLimit: 5
      reverseDigitsGroupLimit: 5
      notStartWith: ["0", "1"]
      restrictedNumbers: []
      poolMinThreshold: 1000
      poolGenerationBatchSize: 5000
      poolCheckIntervalSeconds: 30
      exhaustionMaxAttempts: 1000
      subBatchSize: 10000

# ---------------------------------------------------------------------------
# AWE — Approval Workflow Engine (openg2p-awe subchart).
#
# Installed as part of the Registry platform. The subchart ships sensible
# defaults for the backend, UI, Keycloak clients (awe-admin-portal,
# awe-admin-resolver) and Istio routing — we only override what must differ
# when AWE runs UNDER the registry release rather than standalone:
#
#   1. enabled            — gates the dependency (Chart.yaml condition).
#   2. postgres-init      — distinct nameOverride so AWE's DB-provisioning
#                           Job + ServiceAccount don't collide with the
#                           registry's own postgres-init (both default to
#                           `<release>-postgres-init`).
#   3. keycloak-init      — distinct nameOverride so AWE's client-provisioning
#                           Job + ConfigMap don't collide with the registry's
#                           own keycloak-init (both default to
#                           `<release>-keycloak-init-<revision>`).
#
# AWE's DB/secret names are namespaced via the `awe*` globals above. Its
# Keycloak admin client IDs are release-scoped via the `aweAdmin*` globals
# above AND the keycloak-init realm override below — the openg2p-awe subchart
# hardcodes `awe-admin-portal` / `awe-admin-resolver` literals in its realm
# block (not the globals), so we re-declare the realm clients/users here with
# `{{ .Release.Name }}-` prefixes. keycloak-init runs `tpl` over this block,
# so the template expressions resolve at install time. This makes the created
# Keycloak clients, their client-secret Secret, and the role-mappings unique
# per registry instance in the shared `staff` realm.
# ---------------------------------------------------------------------------
# AWE is installed ONCE per environment by commons-services (shared instance).
# This registry no longer bundles the openg2p-awe subchart or provisions AWE's
# Keycloak clients — commons-services owns those. See the AWE globals block above
# for how this registry consumes the shared AWE and registers its callback secret.

# ---------------------------------------------------------------------------
# Sanity — in-cluster smoke + DCI/consent e2e for the partner-api.
# ---------------------------------------------------------------------------
# Runs automatically on every install/upgrade as a post-install/upgrade hook.
#   runE2e=false (default) → smoke only (partner-api liveness + DCI route). Needs
#     nothing else — no PM, no CM, no auth, no data created.
#   runE2e=true → also the signed DCI search round-trip. Seeds the shared sanity
#     partner into Partner Management (key) and the Consent Manager (binding +
#     policy) first, then signs a DCI envelope + consent JWS and asserts the
#     response is permitted and clamped. Needs reachable PM + CM + the seed
#     clients' Keycloak roles (partner_manager on PM, CONSENT_MANAGER_ADMIN on CM),
#     and the enforcement switches ON to exercise consent (global.*Enabled).
sanity:
  # On by default. A bare platform install carries no sample and no bulk data —
  # every dbSeed loader below is off — so the smoke suite is the ONLY thing that
  # says whether the deploy is actually serving. It creates nothing and needs
  # nothing beyond the registry itself, and questions.yaml has advertised this as
  # `default: true` all along; the value said otherwise, which is the bug.
  # runE2e stays off: the full round-trip needs PM, CM, AWE and Keycloak admin.
  enabled: true
  image:
    repository: registry.gitlab.com/openg2p/registry/registry-platform/sanity-tests
    tag: develop
    pullPolicy: Always
  # In-cluster partner-api Service URL (no ingress path prefix), :80.
  partnerBaseUrl: 'http://{{ .Release.Name }}-partner-api'
  verifyTls: false
  runE2e: false
  # true (default) → the Job propagates pytest's exit code, so a failing suite
  #   fails the Job and therefore the install/upgrade. A sanity run that could not
  #   verify the registry must not be reported as a healthy deploy.
  # false → the Job always exits 0 (opt-out; read the pod logs for results). Use
  #   only where a red deploy is worse than an unverified one.
  #
  # NB this gates on FAILURES, not skips. Tests whose dependencies are not
  # configured (no commons-services on a bring-up install) still skip and stay
  # green; a dependency that IS configured and then breaks now fails.
  failOnError: true
  readinessTimeout: 180
  # The consent object's audience (== the CM binding audience) + the registry's
  # controller id (== data_controller). Kept stable so the binding is reused.
  # Variant-neutral: this is the PLATFORM's fixture, and every variant inherits
  # it. They were named for the farmer registry, which is where they were first
  # written, not because anything farmer-specific reads them.
  # ── Agent Portal / VC issuance ──────────────────────────────────────────
  # The VC tests skip unless the Agent Portal is enabled AND an agent password
  # is supplied: the agent realm is provisioned outside this chart, so the suite
  # cannot create its own identity there the way it does for staff.
  agentUsername: sanity-agent
  agentPassword: ""
  # National (foundational) ID the VC e2e issues against.
  vcNationalId: TEST_SANITY_VC_0001

  cmAudience: OPENG2P_SANITY_PARTNER
  controllerId: openg2p-sanity-controller
  # DCI envelope sender id — PARTNER_<UPPER> must equal the PM partner reference
  # (PARTNER_CM_SANITY), i.e. sender "cm_sanity".
  dciSenderId: cm_sanity
  regType: Individual
  regRecordType: 'spdci-extensions-dci:Individual'
  # What the DCI search matches on (ILIKE '%<text>%' against search_text). This
  # MUST be the sanity record's functional_record_id, NOT the SANITYE2E marker:
  # the change-request test runs first and its approval regenerates search_text
  # from the record's real columns, dropping the manually-stuffed marker. The
  # functional_record_id is a genuine search-text field, so it survives — and it
  # appears in no seeded sample data, so the e2e only ever matches its own record.
  # data_seed.py builds the record from this same value, so the two cannot drift.
  searchText: SANITY-INDIVIDUAL-0001
  # Scopes the seeded CM policy allows + the consent object requests.
  #
  # These MUST be top-level keys of THIS register's outgoing DCI template:
  # clamping is a strict allow-list over the rendered record's top-level keys, so
  # a scope naming anything else silently clamps every record to {}. There is no
  # sub-field granularity — a scope carries everything nested under it. The values
  # below are the reference Individual register's; a variant that ships a
  # different template must override them (farmer-registry does).
  dataScopes: "demographic_info"
  # Scopes deliberately NOT consented to; the e2e asserts these never come back.
  deniedScopes: "member_identifier"
  # The reference Individual register (must match g2p_register_definitions.sql).
  # Used to find the register's bound AWE change-request policy and to raise the
  # CR. NB the KEY is still named farmerRegisterId — renaming it means changing
  # the SANITY_FARMER_REGISTER_ID env in _helpers.tpl, cfg.farmer_register_id in
  # the sanity suite, and farmer-registry's override, so it is left for a
  # coordinated change rather than half-renamed here.
  farmerRegisterId: a0000000-0000-4000-8000-000000000001
  # UI coordinates the change-request payload carries. Optional — set if the
  # deployment's metadata requires a specific tab/section.
  crTabId: "individual_info_tab"
  crSectionId: "in_demographic_details"
  # AWE applies its decision via a webhook back to the registry, so the change
  # lands asynchronously — how long the e2e waits for it.
  aweSettleTimeout: 90
  # Audit Manager exposes NO query API (ingest + health only), so the audit
  # assertion reads its table directly. Defaults match the commons install;
  # host falls back to global.postgresqlHost.
  auditDbHost: ""
  auditDbPort: 5432
  auditDb: audit_manager
  auditDbUser: audit_manager_user
  # Audit Manager's DB password Secret (created by commons-services). NB: the
  # secret is named `audit-manager` and the key is `audit-manager-db-user` —
  # matching what the auditmanager deployment itself mounts.
  auditDbSecret: audit-manager
  auditDbUserPasswordKey: audit-manager-db-user
  auditTimeout: 60
  # Registry staff-portal-api — the change-request e2e logs in as REAL demo
  # users via the password grant (the release's Keycloak client is a browser
  # OIDC client with no service account). It reuses the users keycloak-init
  # already provisions with global.aweApproverUserPassword.
  staffBaseUrl: 'http://{{ .Release.Name }}-staff-portal-api'
  # The suite provisions its OWN Keycloak user (sanity-data-seed Job) rather
  # than borrowing the keycloak-init demo users: those are created with a
  # TEMPORARY password, so Keycloak forces UPDATE_PASSWORD and a password grant
  # fails with "Account is not fully set up". The seeded user gets a
  # non-temporary password, so it can log in non-interactively. It is a TEST
  # identity — delete the `sanity-e2e` user from the staff realm to remove it.
  staffUsername: sanity-e2e
  staffPassword: sanity-e2e-pass
  # Roles granted to the test user on global.authClientId — these expand to the
  # changeRequest:create / changeRequest:approve / register:view /
  # registerHistory:view permissions the change-request flow needs.
  staffRoles: "Operations Administrator,Technical Administrator"
  # Safety bound on the approval stage-walk (the shipped policy has 2 stages).
  maxApprovalRounds: 5
  # How long the change-request test keeps retrying the first permission-gated
  # call while the registry's permission path warms up just after install.
  authReadyTimeout: 120
  # AWE admin role granted to the sanity user (a client role on the shared AWE's
  # awe-admin-portal client) so it can approve every task on the change request
  # — the shipped policy stages are mode='all' and name demo approvers whose
  # temporary passwords the suite cannot use.
  aweAdminClientId: awe-admin-portal
  aweAdminRole: AWE_ADMIN
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
