global:
  registryHostname: '{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.org'

  # Database
  postgresqlHost: commons-postgresql

  registryDB:  '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  registryDBPort: 5432
  registryDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}-db-user'

  # Master Data DB credentials — must match the values set by the
  # openg2p-commons-services chart (release `commons-services`). Commons
  # uses plain DB names (no release-name prefix) since only one Master
  # Data instance is expected per environment.
  masterDataDB: 'master_data'
  masterDataDBPort: 5432
  masterDataDBUser: 'master_data_user'
  masterDataDBSecret: 'master-data'
  masterDataDBUserPasswordKey: 'master-data-db-user'

  # Redis
  redisInstallationName: '{{ .Release.Name }}-redis-master'

  # MinIO — commons-minio: root-user/root-password + readonly-user/readonly-password
  minioSecret: commons-minio
  minioAccessKey: root-user
  minioSecretKey: root-password
  minioReadonlyAccessKey: readonly-user
  minioReadonlySecretKey: readonly-password
  # External MinIO S3 API endpoint. Must be reachable from end-user browsers
  # because the registry generates pre-signed S3 URLs that browsers follow
  # directly. Commons-base's Istio VirtualService exposes the S3 API at
  # `minio-api.<basedomain>` (apiHost in commons-base values.yaml). The
  # default below is a placeholder using the namespace + openg2p.org —
  # OPERATORS MUST override this in `questions.yaml` / Rancher UI / values
  # file to match their actual base domain. NOTE: `minio.<basedomain>` is
  # the *Console* UI — do NOT point S3 clients at it.
  minioHost: 'minio-api.{{ .Release.Namespace }}.openg2p.org'
  # MinIO buckets — hard-set to match DocumentBucket enum values used by
  # the platform document handler (physical bucket name == enum value).
  # Catalog rows store bucket as 'templates' / 'documents' / 'default'.
  defaultBucketName: 'default'
  templateBucketName: 'templates'
  # Registrant photos / record images land in the documents bucket and are
  # catalogued in g2p_registry_documents. The uploader that does the cataloguing
  # is variant-specific (upload_images.py ships in a variant's db-seed image, not
  # this one) because the images belong to that variant's sample records.
  documentsBucketName: 'documents'
  minioSecure: true

  # Security & Authentication
  keymanagerInstallationName: commons-services-keymanager
  keycloakBaseUrl: 'https://keycloak.{{ .Release.Namespace }}.openg2p.org'
  # Single shared `staff` realm per namespace — all registry releases (and
  # other apps like AWE) authenticate against the same realm; each release
  # gets its OWN client (clientId below) inside that shared realm.
  keycloakRealm: 'staff'
  keycloakIssuerUrl: '{{ tpl .Values.global.keycloakBaseUrl $ }}/realms/{{ tpl .Values.global.keycloakRealm $ }}'

  registryKeymanagerAuthEnabled: false
  # Per-release keymanager app id (uppercased Release.Name) so signature
  # scopes don't collide across registry instances in the same environment.
  registryKeymanagerAppId: '{{ .Release.Name | upper }}'

  # ------------------------------------------------------------------
  # Partner signature verification + Consent Manager (PDP) integration
  # ------------------------------------------------------------------
  # The partner-api (a PEP) verifies the DCI envelope signature against partner
  # public keys served by Partner Management (crypto backend "partner-mgmt"),
  # and enforces consent by calling the Consent Manager /validate before
  # returning data — clamping the response to the effective data scopes.
  #
  # Two INDEPENDENT kill-switches over real PII egress, defaulted ON to FAIL
  # CLOSED — matching the registry platform's own defaults.
  #
  #   partnerSignatureValidationEnabled -> verify the DCI envelope signature
  #                                        against the partner's key in Partner
  #                                        Management.
  #   consentEnforcementEnabled         -> call the Consent Manager /validate for
  #                                        the request's consent object, and clamp
  #                                        returned fields to the consented scopes.
  #
  # Turning either OFF is a deliberate, auditable choice, not a default:
  #   * with signature validation off, the `signature` field is still required
  #     but NEVER inspected — any string passes;
  #   * with consent enforcement off, the Consent Manager is never called and
  #     records are returned UNCLAMPED — every field the DCI template emits, to
  #     any caller.
  # Either bypass is logged and stamped into the DCI response header meta
  # (signature_validation / consent_enforcement), which is the only outward
  # signal that it is off.
  #
  # Legitimate reasons to disable: performance testing, or a bring-up install
  # where commons-services (CM/PM) is not yet wired — the DCI search will reject
  # requests until it is. Note the sanity e2e cannot meaningfully test data
  # sharing with these off (it skips those assertions), but the e2e is itself
  # off by default (sanity.runE2e), so a disabled install is unaffected.
  partnerSignatureValidationEnabled: true
  consentEnforcementEnabled: true
  # Partner-key crypto backend: partner-mgmt | keymanager | local
  registryCryptoBackend: partner-mgmt
  # Partner Management partner-api — source of partner public keys. PM is now
  # part of commons-services (service name commons-services-pm-*), matching the
  # g2p-bridge chart. Port 80 is implicit (bare hostname).
  partnerManagementApiUrl: 'http://commons-services-pm-partner-api'
  # Consent Manager partner-api base URL — the /validate PDP endpoint. CM is now
  # part of commons-services (service name commons-services-cm-*), matching PM.
  consentManagerUrl: 'http://commons-services-cm-partner-api'
  consentManagerTimeoutSeconds: 5
  # Used only by the sanity e2e (to seed the shared test partner):
  #  * PM staff-portal-api (onboard + approve the partner key)
  #  * CM staff-portal-api (create the partner binding + policy)
  #  * the CM Keycloak client that holds the CONSENT_MANAGER_ADMIN role
  partnerManagementAdminApiUrl: 'http://commons-services-pm-staff-portal-api'
  consentManagerStaffUrl: 'http://commons-services-cm-api'
  consentManagerAuthClientId: 'consent-manager'
  # Keycloak client the sanity seed authenticates AS to call PM's admin API — it
  # holds PM's `partner_manager` role. PM provisions it as `<pm-release>-staff-portal`
  # with its secret in a Secret of the same name (key client_secret). In the
  # commons install that is `commons-services-staff-portal` (matches g2p-bridge).
  pmSeedClientId: 'commons-services-staff-portal'
  # OIDC client ID — per-release; MUST equal the clientId in keycloak-init.realms below.
  authClientId: '{{ .Release.Name }}-staff-portal'
  # K8s Secret name holding the client password (keycloak-init names the
  # Secret after the clientId, so this must match authClientId above).
  authClientSecret: '{{ .Release.Name }}-staff-portal'
  # Key inside the secret containing the client password
  authClientSecretKey: 'client_secret'

  # IAM service internal URL
  iamServiceUrl: 'http://commons-services-iam-staff-portal-api'

  # Redis-backed auth (refresh tokens + OAuth transaction state) for staff-portal-api.
  # Uses the same shared Redis as iam-staff-portal-api (commons-redis-master).
  authRedisInstallationName: 'commons-redis'
  authRefreshTokenTtlSeconds: 1800
  # Double-submit CSRF validation on state-changing staff-portal-api requests.
  csrfEnabled: true

  # Master Data API internal URL
  masterDataApiUrl: 'http://commons-services-master-data-api'

  # ID Generator
  # Public hostname (used by browser/external callers via Istio VirtualService).
  idGeneratorHostname: 'idgenerator-{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.org'
  idGeneratorApiUrl: 'https://{{ tpl .Values.global.idGeneratorHostname $ }}/v1'
  # Internal cluster URL — used by sibling pods (e.g. celery-worker) to reach
  # the ID Generator without hopping through the ingress gateway. The K8s
  # Service is named "<release>-id-generator" on port 80.
  idGeneratorInternalUrl: 'http://{{ .Release.Name }}-id-generator/v1'

  # OpenG2P Audit Manager integration
  # Both `auditEnabled=true` AND `auditManagerUrl` must be set for emission
  # to actually happen — and both are set below, so audit is ON by default.
  # Audit Manager itself is NOT deployed by this chart: it is installed once
  # per environment by commons-services, and the URL below points at it. If it
  # is absent, emission fails silently (the middleware is fire-and-forget) —
  # it does not break requests.
  # Wired into both staff-portal-api and partner-api. Each service consumes
  # these globals via its own envVars block below. Older service images that
  # lack AuditMiddleware simply ignore the env vars — no error.
  auditEnabled: true
  auditManagerUrl: 'http://commons-services-auditmanager:80'
  # Set to false to skip auditing of rejected anonymous calls (401/403
  # without a populated principal). Default true captures attempted
  # unauthorized access for security review.
  auditAnonymousFailures: true

  # ---------------------------------------------------------------------------
  # AWE (Approval Workflow Engine) — NO LONGER installed by this chart. AWE is
  # deployed ONCE per environment by commons-services. This registry CONSUMES
  # that shared instance: it calls AWE's API at aweBaseUrl and registers its own
  # per-registry callback secret into the shared AWE database (via db-seed + the
  # awe-callback-hmac-secret template).
  #
  # The DB globals below must match the fixed contract commons-services' AWE
  # exposes (global.aweDB / aweDBUser / aweDBSecret / aweDBUserPasswordKey) so
  # db-seed can insert this registry's callback_secret row into the shared AWE
  # DB. The DB-user Secret (`awe-db-user`) is created by commons-services in the
  # same namespace, so this registry can read it.
  # ---------------------------------------------------------------------------
  # Shared AWE hostname (matches commons-services' awe.<baseDomain>).
  aweHostname: 'awe.{{ .Release.Namespace }}.openg2p.org'
  aweDB: awe
  aweDBPort: 5432
  aweDBUser: awe_user
  aweDBSecret: awe-db-user
  aweDBUserPasswordKey: awe-db-user-password

  # Staff-portal-api AWE client + db-seed callback-secret registration
  aweEnabled: true
  aweBaseUrl: 'https://{{ tpl .Values.global.aweHostname $ }}'
  # Callback-secret id — per-registry so the id the staff-portal-api presents
  # (REGISTRY_STAFF_PORTAL_API_AWE_CALLBACK_SECRET_ID) and the row db-seed
  # inserts into the shared AWE `callback_secret` table are unique to THIS
  # registry instance. The extension SQL (awe_meta_data/40_callback_secret.sql.tpl)
  # reads this via the AWE_CALLBACK_SECRET_ID env passed by the db-seed Job.
  aweCallbackSecretId: '{{ .Release.Name }}'
  # Full staff-portal webhook URL stored in AWE callback_secret.caller_service
  # and passed to the registry as REGISTRY_STAFF_PORTAL_API_AWE_DEFAULT_CALLBACK_URL.
  # e.g. https://staff-ofr.nsr.openg2p.org/awe/webhooks/decision
  aweDefaultCallbackUrl: 'https://staff-{{ tpl .Values.global.registryHostname $ }}/awe/webhooks/decision'
  aweHttpTimeoutSeconds: 30
  aweWebhookTimestampToleranceSeconds: 300
  aweCallbackHmacSecretName: '{{ .Release.Name }}-awe-callback-hmac'
  aweCallbackHmacSecretKey: 'hmac-secret'
  # NOTE: despite the name, this is the initial Keycloak password for the seeded
  # demo staff users below (keycloak-init), not an AWE resource. Kept here.
  aweApproverUserPassword: 'pass'
  # Helm release that hosts the shared AWE — its Service is <aweReleaseName>-awe.
  # Used by db-seed to wait for the AWE API before seeding the callback secret.
  aweReleaseName: commons-services

# Logging is handled cluster-wide by OpenTelemetry + Grafana Loki (deployed by
# the platform's infra automation). The OTel agent DaemonSet tails every pod's
# logs automatically, so no per-chart logging config is needed here anymore.

# DB Seed — runs configuration and (optionally) sample data SQL scripts
# after all application pods are ready. Uses a Docker image published
# from openg2p-registry-gen2-extensions.
dbSeed:
  enabled: true
  # LEGACY. Loads a five-level country->village hierarchy into the master_data DB
  # from openg2p-data/geo/geo.csv, keyed by slug-paths like
  # "kamuntu/kilima/karamu/uzima/billyu".
  #
  # Off, and it should stay off. Master Data seeds its own geography from a
  # country pack now (geoSeed.countryPack there), keyed by P-code — so turning
  # this on writes a SECOND hierarchy over the first, in a different id space and
  # with a fixed depth of five levels that only describes Kamuntu. Ethiopia has
  # four, ending at woreda.
  #
  # It is no longer needed for sample data either: load_sample_data.py reads the
  # hierarchy and the sample people from Master Data directly, whatever country
  # and however many levels it holds.
  #
  # Kept only for a deployment that still has no Master Data country pack.
  loadGeoData: false
  # Match the register's geo dropdowns to the hierarchy Master Data holds.
  # An extension's UI metadata names its levels and fixes their number; a
  # country whose pack disagrees gets dropdowns that silently return nothing.
  # Off by default so an existing deployment keeps the metadata it shipped.
  syncGeoWidgets: false
  # Load sample/demo data into the registry (disabled by default).
  # Farmer's db-seed image does this through the intake-form API (household
  # first, then farmer with that household, land before crop/livestock/inputs)
  # and AWE-approves as alex.carter then nina.patel.
  loadSampleData: false
  intakeSeed:
    submitUser: alex.carter
    approver1: alex.carter
    approver2: nina.patel
    maxHouseholds: 50
  # Upload sample profile images (500 colored-initials avatars) to MinIO
  # and update g2p_register_farmers.record_image_document_id. Requires
  # loadSampleData=true (individuals must exist first).
  loadImages: false
  # Upload flat Jinja templates from the db-seed image to MinIO after SQL seed
  loadTemplates: true
  image:
    repository: registry.gitlab.com/openg2p/registry/registry-platform/db-seed
    tag: "develop"
    pullPolicy: Always

  # DB Seed runs as a one-shot Helm post-install/post-upgrade hook Job.
  # It's just psql replaying SQL scripts plus a one-shot python upload of the
  # sample images to MinIO — minimal footprint. Request 128Mi covers the psql
  # + upload baseline; the 512Mi limit is a generous runaway cap for larger
  # seed bundles (no cpu limit — see staffApi rationale).
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# ---------------------------------------------------------------------------
# IAM registration — self-registers this registry into the IAM staff portal.
# Runs as a one-shot post-install/post-upgrade hook Job that pushes this
# registry's tile + roles/permissions catalog (files/iam-registration/payload.json)
# to the IAM staff-portal API. The application_mnemonic is the per-release
# Keycloak client (global.authClientId), application_url is the Staff Portal
# UI host (https://<registryHostname>), and api_url is the staff API host
# (https://<staffApi.hostname>) used by IAM data policies. Multiple registry
# instances coexist.
#
# Auth: obtains an access token via client_credentials using the per-release
# staff-portal client + secret created by keycloak-init (global.authClientId /
# authClientSecret) — the same client other registry services authenticate
# with. The staff realm must be a trusted login provider in IAM (it is, since
# the registry's own staff-portal-api authenticates against it).
#
# NOTE (CORS): IAM's CORS allow-list is static and read once at IAM startup, so
# this registry's origin (https://<registryHostname>) must also be added to
# IAM_STAFF_CORS_ALLOW_ORIGINS on the IAM chart and IAM rolled. See the IAM repo
# iam-staff-portal-api/samples/README.md.
iamRegister:
  enabled: true
  # Human-readable name of this registry in the IAM application tile. The
  # roles/permissions catalog in files/iam-registration/payload.json is
  # registry-agnostic, so this description is the only variant-specific field —
  # and it is a value (not a file) precisely so a wrapper chart can set it: a
  # subchart's .Files cannot be overridden by its parent.
  applicationDescription: "OpenG2P Registry"
  # Optional staff API base URL stored as api_url on the IAM application.
  # IAM uses this (not a global REGISTRY_API_URL) to load register fields for
  # data policies. Defaults to https://<staffApi.hostname>.
  # apiUrl: ""
  image:
    repository: curlimages/curl
    tag: "8.11.1"
    pullPolicy: IfNotPresent
  # Job-level retry budget; the script also retries token + register internally.
  backoffLimit: 5
  # Internal retry attempts (×5s) while the Keycloak client / IAM finish coming up.
  tokenMaxAttempts: 30
  registerMaxAttempts: 10
  # Tiny one-shot hook Job (token fetch + IAM self-register). Request 64Mi
  # covers the baseline; 128Mi limit is a generous cap (no cpu limit — see
  # staffApi rationale).
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

postgres-init:
  enabled: true
  postgresql:
    host: '{{ .Values.global.postgresqlHost }}'
    port: 5432
    existingSecret: commons-postgresql
    existingSecretPostgresPasswordKey: postgres-password
  databases:
    - name: '{{ tpl .Values.global.registryDB $ }}'
      user: '{{ tpl .Values.global.registryDBUser $ }}'
      secret: '{{ tpl .Values.global.registryDBSecret $ }}'
      secretUserPasswordKey: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
      extensions:
        - 'pg_trgm'
    # NOTE: the AWE callback-HMAC secret is NOT provisioned here. A second
    # entry reusing this same db name would render a duplicate postgres-init
    # Job (Helm 4 SSA "spec.template field is immutable") and, with the
    # idempotent init-db.sh, overwrite the registry user's password with the
    # HMAC value. It is minted directly by templates/awe-callback-hmac-secret.yaml.

partnerApi:
  enabled: true
  nameOverride: partner-api
  hostname: 'partner-{{ tpl .Values.global.registryHostname $ }}'

  replicaCount: 1
  # HPA enabled: with 3 workers per pod (below), scale is horizontal. CPU-based
  # only — memory-based HPA is disabled (null target) because Python RSS does
  # not shrink after a spike, so a memory target would scale up and never scale
  # back down. Raise minReplicas to 2+ for HA in production; tune targetCPU and
  # maxReplicas against a load test.
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: null
  updateStrategy:
    type: RollingUpdate
  serviceAccount:
    create: false
    name: ""
  image:
    repository: registry.gitlab.com/openg2p/registry/registry-platform/partner-api
    tag: "develop"
    pullPolicy: Always
  podSecurityContext:
    enabled: false
    fsGroup: 1001
  containerSecurityContext:
    enabled: false
    runAsUser: 1001
    runAsNonRoot: true

  openapiRootPath: /

  service:
    type: ClusterIP
    port: 80
    externalTrafficPolicy: Cluster

  istio:
    enabled: true
    virtualservice:
      enabled: true
      # Hostname inlined (not `tpl .Values.hostname $`) — the component templates
      # rebind `.Values` to staffApi/partnerApi sub-tree via deepCopy,
      # which boxes string values as interface{} and breaks nested `tpl`.
      # `.Values.global.*` is preserved un-boxed in the rebound context.
      host: 'partner-{{ tpl .Values.global.registryHostname $ }}'
      gateway: "internal"
      destination: '{{ .Release.Name }}-partner-api'
      destinationPort: '{{ .Values.partnerApi.service.port }}'
      prefix: '{{ .Values.openapiRootPath }}/'
      rewriteUri: "/"
    gateway:
      enabled: false
      host: 'partner-{{ tpl .Values.global.registryHostname $ }}'
      ingressController:
        istio: ingressgateway
      httpTlsRedirect: false
      httpEnabled: true
      httpsEnabled: false
      tls:
        mode: SIMPLE
        credentialName: ""

  envVars:
    # gunicorn/uvicorn worker count (overrides the image default). Fewer workers
    # = smaller, more predictable per-pod memory; scale horizontally via the HPA
    # above rather than many workers per pod. Bump this per-environment if
    # concurrent blocking-DB throughput needs it — no image rebuild required.
    PARTNER_NO_OF_WORKERS: "3"
    REGISTRY_PARTNER_API_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_PARTNER_API_DB_DBNAME: '{{ tpl .Values.global.registryDB $ }}'
    REGISTRY_PARTNER_API_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_PARTNER_API_DB_USERNAME: '{{ tpl .Values.global.registryDBUser $ }}'
    REGISTRY_PARTNER_API_PORT: '{{ .Values.containerPort }}'

    REGISTRY_PARTNER_API_OPENAPI_ROOT_PATH: '{{ .Values.openapiRootPath }}'

    REGISTRY_PARTNER_API_MASTER_DATA_DB_DRIVER: 'postgresql+asyncpg'
    REGISTRY_PARTNER_API_MASTER_DATA_DB_USERNAME: '{{ .Values.global.masterDataDBUser }}'
    REGISTRY_PARTNER_API_MASTER_DATA_DB_HOSTNAME: '{{ .Values.global.postgresqlHost }}'
    REGISTRY_PARTNER_API_MASTER_DATA_DB_PORT: '{{ .Values.global.registryDBPort }}'
    REGISTRY_PARTNER_API_MASTER_DATA_DB_DBNAME: '{{ .Values.global.masterDataDB }}'

    REGISTRY_PARTNER_API_KEYMANAGER_API_BASE_URL: "{{ .Values.global.keymanagerInstallationName }}/v1/keymanager"
    REGISTRY_PARTNER_API_KEYMANAGER_API_TIMEOUT: 10
    REGISTRY_PARTNER_API_KEYMANAGER_API_DOMAIN: "AUTH"
    REGISTRY_PARTNER_API_KEYMANAGER_SSL_VERIFY: False
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_ENABLED: '{{ .Values.global.registryKeymanagerAuthEnabled }}'
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_URL: "{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token"
    REGISTRY_PARTNER_API_KEYMANAGER_AUTH_CLIENT_ID: '{{ tpl .Values.global.authClientId $ }}'
    REGISTRY_PARTNER_API_KEYMANAGER_SIGN_APP_ID: '{{ tpl .Values.global.registryKeymanagerAppId $ }}'
    REGISTRY_PARTNER_API_KEYMANAGER_SIGN_REF_ID: ""

    # Partner signature verification (transport) + Consent Manager enforcement.
    # Both default OFF (global.*Enabled) — enable for production PII egress.
    REGISTRY_PARTNER_API_SIGNATURE_VALIDATION_ENABLED: '{{ .Values.global.partnerSignatureValidationEnabled }}'
    REGISTRY_PARTNER_API_CONSENT_ENFORCEMENT_ENABLED: '{{ .Values.global.consentEnforcementEnabled }}'
    REGISTRY_PARTNER_API_CRYPTO_BACKEND: '{{ .Values.global.registryCryptoBackend }}'
    REGISTRY_PARTNER_API_PARTNER_MGMT_API_URL: '{{ tpl .Values.global.partnerManagementApiUrl $ }}'
    REGISTRY_PARTNER_API_PARTNER_MGMT_ADMIN_API_URL: '{{ tpl .Values.global.partnerManagementAdminApiUrl $ }}'
    REGISTRY_PARTNER_API_PARTNER_MGMT_ADMIN_TOKEN_URL: "{{ tpl .Values.global.keycloakIssuerUrl $ }}/protocol/openid-connect/token"
    REGISTRY_PARTNER_API_PARTNER_MGMT_ADMIN_CLIENT_ID: '{{ tpl .Values.global.pmSeedClientId $ }}'
    REGISTRY_PARTNER_API_CONSENT_MANAGER_URL: '{{ tpl .Values.global.consentManagerUrl $ }}'
    REGISTRY_PARTNER_API_CONSENT_MANAGER_TIMEOUT: '{{ .Values.global.consentManagerTimeoutSeconds }}'

    REGISTRY_PARTNER_API_MINIO_ENDPOINT: '{{ tpl .Values.global.minioHost $ }}'
    REGISTRY_PARTNER_API_MINIO_SECURE: '{{ .Values.global.minioSecure }}'
    # Match documentsBucketName so partner-served record-image URLs resolve.
    REGISTRY_PARTNER_API_MINIO_BUCKET_NAME: '{{ tpl .Values.global.documentsBucketName $ }}'
    REGISTRY_PARTNER_API_TEMPLATE_BUCKET_NAME: '{{ tpl .Values.global.templateBucketName $ }}'

    # OpenG2P Audit Manager integration. No-op unless both AUDIT_ENABLED=true
    # and AUDIT_MANAGER_URL are set (controlled via global.auditEnabled and
    # global.auditManagerUrl). Safe to leave wired in older images that lack
    # the AuditMiddleware — env vars are simply ignored there. Partner-api
    # actor identity defaults to anonymous until controllers opt in to set
    # request.state.audit_actor — see the Audit Manager docs (Integration
    # with Registry → Audit Middleware — Partner API) for the enrichment
    # pattern.
    REGISTRY_PARTNER_API_AUDIT_ENABLED: '{{ .Values.global.auditEnabled }}'
    REGISTRY_PARTNER_API_AUDIT_MANAGER_URL: '{{ .Values.global.auditManagerUrl }}'
    REGISTRY_PARTNER_API_AUDIT_ANONYMOUS_FAILURES: '{{ .Values.global.auditAnonymousFailures }}'
  envVarsFrom:
    REGISTRY_PARTNER_API_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.registryDBSecret $ }}'
        key: '{{ tpl .Values.global.registryDBUserPasswordKey $ }}'
    REGISTRY_PARTNER_API_MASTER_DATA_DB_PASSWORD:
      secretKeyRef:
        name: '{{ tpl .Values.global.masterDataDBSecret $ }}'
        key: '{{ tpl .Values.global.masterDataDBUserPasswordKey $ }}'
    REGISTRY_PARTNER_API_MINIO_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioAccessKey $ }}'
    REGISTRY_PARTNER_API_MINIO_SECRET_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioSecretKey $ }}'
    REGISTRY_PARTNER_API_MINIO_READ_ACCESS_KEY:
      secretKeyRef:
        name: '{{ tpl .Values.global.minioSecret $ }}'
        key: '{{ tpl .Values.global.minioReadonlyAccessKey $ }}'
