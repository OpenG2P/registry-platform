{{- $s := .Values.dashboards.supersetAdminPasswordSecret -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (tpl ($s.name | default "") $) -}}
{{- /*
Password for the Superset service account the dashboards Job imports as. Nobody
types it: it authenticates a machine to Superset's REST API (provider=db, which
AUTH_OAUTH leaves alone), for embedding and for G2P Insights.

Rendered only when the Secret does not exist yet, and then kept. Every registry
in the namespace, and G2P Insights, use the same name and key, so whichever
installs first creates it and the others use it: Helm refuses to adopt an object
another release owns, and regenerating it on upgrade would change the password
under the running Insights pods.

`lookup` sees nothing under `helm template` or `--dry-run`, so rendered output
carries a new password each time. Pipelines that render and apply manifests
create this Secret themselves and set generate=false.
*/ -}}
{{- if and .Values.dashboards.enabled $s.generate $s.name (not $existing) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ tpl $s.name $ }}
  # No app.kubernetes.io/instance label: the uninstall scripts delete a
  # release's Secrets by that label, and this one is shared.
  labels:
    app.kubernetes.io/name: superset-service-account
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    # Kept when the release is removed: the Superset account still carries this
    # password, and other registries and Insights use it.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ $s.key | default "password" }}: {{ randAlphaNum 32 | b64enc }}
{{- end }}
