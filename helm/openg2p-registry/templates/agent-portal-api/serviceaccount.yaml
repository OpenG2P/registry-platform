{{- /*
  Every resource of this component is gated on agentPortalApi.enabled, so a
  chart installed with the capability off renders exactly what it rendered
  before this component existed — no Service, no ServiceAccount, no route.
*/ -}}
{{- if .Values.agentPortalApi.enabled }}
{{- $values := .Values.agentPortalApi -}}
{{- $context := dict "Values" (merge (deepCopy $values) (dict "global" .Values.global)) "Chart" .Chart "Release" .Release "Files" .Files "Capabilities" .Capabilities -}}
{{- with $context -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agentPortalApi.serviceAccountName" . }}
  labels: {{- include "common.labels.standard" (dict "customLabels" .Values.commonLabels "context" $) | nindent 4 }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
{{- end }}
{{- end -}}
{{- end }}
