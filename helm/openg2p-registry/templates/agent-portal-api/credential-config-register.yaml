{{- if and .Values.agentPortalApi.enabled .Values.agentPortalApi.vcIssuance.enabled .Values.agentPortalApi.vcIssuance.registerEnabled .Values.agentPortalApi.vcDefinitions }}
{{- /*
  Registers this registry's credential_configs with Inji Certify.

  Certify is a generic signing service: it can only issue a credential type it
  already knows about. The Agent Portal API pushes claims naming a
  `credential_configuration_id`, so without this Job the very first issuance
  fails on an id Certify has never heard of.

  Ownership split: the ISSUER (DID + signing key) is environment-level and set
  at Certify install — this Job only *references* it. The DEFINITIONS (template,
  types, fields, scope, QR settings) are module-owned and come from
  agentPortalApi.vcDefinitions[].certifyConfig, because the claim fields differ
  per registry.
*/ -}}
{{- $iss := .Values.global.vcIssuer -}}
{{- /* Fail the install rather than register a config with an empty issuer:
       Certify would accept it and then sign credentials whose `issuer` is
       blank — unverifiable, and only discovered by a verifier in the field. */ -}}
{{- if not $iss.did }}
{{- fail "\n\nERROR: global.vcIssuer.did is empty but VC issuance is enabled.\n\nSet it to the issuer DID configured at Inji Certify install (commons-services\nglobal.vcIssuerDid), e.g. did:web:certify.<env>.openg2p.org. Credentials signed\nwithout an issuer cannot be verified.\n" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-agent-vc-configs
  labels:
    app.kubernetes.io/name: agent-vc-config-register
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "-1"
data:
{{- range .Values.agentPortalApi.vcDefinitions }}
  {{- if .certifyConfig }}
  {{- $cc := deepCopy .certifyConfig }}
  {{- /* The Velocity template is authored as READABLE JSON (vcTemplateJson) so a
         reviewer can see what a credential will contain. Certify stores and
         decodes it as base64, so encode it here rather than asking a human to
         hand-craft base64 in values.yaml. */}}
  {{- if hasKey $cc "vcTemplateJson" }}
    {{- $_ := set $cc "vcTemplate" (trim (get $cc "vcTemplateJson") | b64enc) }}
    {{- $_ := unset $cc "vcTemplateJson" }}
  {{- end }}
  {{- /* Stamp the environment's issuer onto every definition. Certify validates
         keyManagerAppId/RefId against its key-alias mapper and does not default
         them, so they must be present. */}}
  {{- $body := mergeOverwrite $cc (dict "didUrl" (include "common.tplvalues.render" (dict "value" $iss.did "context" $)) "keyManagerAppId" $iss.keyManagerAppId "keyManagerRefId" $iss.keyManagerRefId "signatureAlgo" $iss.signatureAlgo "signatureCryptoSuite" $iss.signatureCryptoSuite) }}
  {{ .config_id }}.json: |-
{{ $body | toJson | indent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-agent-vc-register
  labels:
    app.kubernetes.io/name: agent-vc-config-register
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    # Runs after the workloads are up, so Certify is reachable.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-vc-config-register
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      containers:
        - name: register
          image: {{ .Values.agentPortalApi.vcIssuance.registerImage }}
          env:
            - name: CERTIFY_BASE_URL
              value: {{ tpl .Values.global.certifyBaseUrl $ | quote }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              for f in /configs/*.json; do
                id=$(basename "$f" .json)
                echo "Registering credential_config '$id' ..."
                code=$(curl -s -o /tmp/resp -w "%{http_code}" -X POST \
                  -H "Content-Type: application/json" \
                  --data @"$f" "$CERTIFY_BASE_URL/credential-configurations" || true)
                echo "  POST -> $code"
                # Certify rejects a duplicate rather than upserting, so an
                # already-registered config is updated via PUT. This is what makes
                # the Job safe to re-run on every upgrade.
                if [ "$code" != "201" ] && [ "$code" != "200" ]; then
                  echo "  exists or failed; trying PUT /$id"
                  curl -s -o /tmp/resp -w "  PUT -> %{http_code}\n" -X PUT \
                    -H "Content-Type: application/json" \
                    --data @"$f" "$CERTIFY_BASE_URL/credential-configurations/$id" || true
                  cat /tmp/resp; echo
                fi
              done
              echo "Credential config registration done."
          volumeMounts:
            - name: configs
              mountPath: /configs
              readOnly: true
      volumes:
        - name: configs
          configMap:
            name: {{ .Release.Name }}-agent-vc-configs
{{- end }}
