questions:

# General
- variable: global.baseDomain
  description: >-
    The DNS domain every OpenG2P hostname in this environment sits under. Every
    other hostname on this form defaults to a name under it — the registry, the
    Agent Portal, Keycloak, eSignet, Certify, the ID generator and the
    cookie domain — so on a non-openg2p.org deployment set this ONE value and the
    rest follow. Override an individual hostname below only where it genuinely
    differs. Do not include a scheme or a trailing slash.
  type: string
  label: Base Domain
  group: General

- variable: global.registryHostname
  description: "Hostname of the registry's staff portal and APIs. Defaults to <release>.<Base Domain>."
  type: string
  label: Registry Hostname
  group: General

- variable: global.postgresqlHost
  description: "PostgreSQL host. Leave as commons-postgresql (installed by commons-base); change only for an external server."
  type: string
  label: PostgreSQL Host
  group: Infrastructure

- variable: global.keycloakBaseUrl
  description: "Public Keycloak URL. Defaults to https://keycloak.<Base Domain>; change only for an external Keycloak."
  type: string
  label: Keycloak URL
  group: Infrastructure

- variable: global.minioHost
  description: "Object store (S3) API endpoint as host:port, no scheme. Leave as commons-garage:3900, the Garage installed by commons-base."
  type: string
  default: "commons-garage:3900"
  label: Object Store (Garage) S3 API Host
  group: Infrastructure

- variable: global.minioSecure
  description: "Use HTTPS to reach the object store. Off for the in-cluster Garage service."
  type: boolean
  default: false
  label: Object Store Uses HTTPS
  group: Infrastructure

- variable: staffApi.enabled
  description: Install Staff Portal API
  type: boolean
  label: Install Staff Portal API?
  group: Components

- variable: staffUi.enabled
  description: Install Staff Portal UI
  type: boolean
  label: Install Staff Portal UI?
  group: Components

- variable: partnerApi.enabled
  description: "Install the Partner API: DCI search, data ingest and activities for partners (signed, consent-checked)."
  type: boolean
  label: Install Partner API?
  group: Components

- variable: global.partnerSignatureValidationEnabled
  description: Verify the partner's signature on every Partner API call (DCI search, ingest, activities, data scopes) against Partner Management keys. ON by default (fail-closed). Turn OFF only for testing or bring-up before Partner Management is wired — doing so accepts unsigned requests.
  type: boolean
  default: true
  label: Verify Partner Signature
  group: Consent & Partner API

- variable: global.partnerDataScopesPublicGetEnabled
  description: Allow the unsigned GET /partner/data_scopes (catalogue of field names, no values). OFF by default — partners use the signed POST.
  type: boolean
  default: false
  label: Public Data Scope Catalogue (GET)
  group: Consent & Partner API

- variable: global.consentEnforcementEnabled
  description: Enforce consent via the Consent Manager before returning data (Partner API), clamping fields to consented scopes. Requires a reachable Consent Manager. ON by default (fail-closed). Turn OFF only for testing or bring-up — doing so returns records unclamped to any caller.
  type: boolean
  default: true
  label: Enforce Consent
  group: Consent & Partner API

- variable: beneApi.enabled
  description: "Install the Beneficiary Portal API. Off by default."
  type: boolean
  label: Install Beneficiary Portal API?
  group: Components


- variable: idgenerator.enabled
  description: "Install the ID Generator, which mints this registry's functional IDs (one pool per register; pools are set in YAML under idgenerator.idGenerator.appConfig.idTypes)."
  type: boolean
  label: Install ID Generator?
  group: Components

# Images
- variable: staffApi.image.repository
  description: Docker image repository for Staff Portal API
  type: string
  label: Staff Portal API Image Repository
  group: Images

- variable: staffApi.image.tag
  description: Docker image tag for Staff Portal API
  type: string
  label: Staff Portal API Image Tag
  group: Images

- variable: staffUi.image.repository
  description: Docker image repository for Staff Portal UI
  type: string
  label: Staff Portal UI Image Repository
  group: Images

- variable: staffUi.image.tag
  description: Docker image tag for Staff Portal UI
  type: string
  label: Staff Portal UI Image Tag
  group: Images

- variable: partnerApi.image.repository
  description: Docker image repository for Partner API
  type: string
  label: Partner API Image Repository
  group: Images

- variable: partnerApi.image.tag
  description: Docker image tag for Partner API
  type: string
  label: Partner API Image Tag
  group: Images

- variable: beneApi.image.repository
  description: Docker image repository for Beneficiary Portal API
  type: string
  label: Beneficiary Portal API Image Repository
  group: Images
  show_if: beneApi.enabled=true

- variable: beneApi.image.tag
  description: Docker image tag for Beneficiary Portal API
  type: string
  label: Beneficiary Portal API Image Tag
  group: Images
  show_if: beneApi.enabled=true

- variable: agentPortalApi.image.tag
  description: Docker image tag for Agent Portal API
  type: string
  label: Agent Portal API Image Tag
  group: Images
  show_if: agentPortalApi.enabled=true

- variable: celeryBeat.image.repository
  description: Docker image repository for Celery Beat Producer
  type: string
  label: Celery Beat Producer Image Repository
  group: Images

- variable: celeryBeat.image.tag
  description: Docker image tag for Celery Beat Producer
  type: string
  label: Celery Beat Producer Image Tag
  group: Images

- variable: celeryWorker.image.repository
  description: Docker image repository for Celery Worker
  type: string
  label: Celery Worker Image Repository
  group: Images

- variable: celeryWorker.image.tag
  description: Docker image tag for Celery Worker
  type: string
  label: Celery Worker Image Tag
  group: Images

# Logging is handled cluster-wide by OpenTelemetry + Loki; no per-chart config.

# DB Seed
- variable: dbSeed.enabled
  description: "Load the registry's configuration (registers, forms, approval policies) into its database after install. Leave on."
  type: boolean
  label: Enable DB Seed
  group: DB Seed

- variable: dbSeed.loadSampleData
  description: Also load sample/demo data into the registry (the variant's sample records and their supporting tables). Off by default.
  type: boolean
  label: Load Sample Data
  group: DB Seed
  show_if: dbSeed.enabled=true

- variable: dbSeed.loadImages
  description: "Upload sample profile images to the object store and link them to the sample records."
  type: boolean
  label: Load Sample Images
  group: DB Seed
  show_if: dbSeed.loadSampleData=true

- variable: dbSeed.loadTemplates
  description: "Upload the registry's document templates to the object store. Leave on: without them records cannot be rendered (e.g. DCI search results)."
  type: boolean
  label: Load Templates to Object Store
  group: DB Seed
  show_if: dbSeed.enabled=true

- variable: dbSeed.optionalSeeds
  description: "Optional seeds the registry's db-seed image ships (folders under /seed/optional), comma-separated, run after the registry's own seed — for example an activity register the registry offers but not every install needs. Leave empty for none."
  type: string
  default: ""
  label: Optional Seeds
  group: DB Seed
  show_if: dbSeed.enabled=true

- variable: dbSeed.image.repository
  description: Docker image repository for the DB seed container
  type: string
  label: DB Seed Image Repository
  group: DB Seed
  show_if: dbSeed.enabled=true

- variable: dbSeed.image.tag
  description: Docker image tag for the DB seed container
  type: string
  label: DB Seed Image Tag
  group: DB Seed
  show_if: dbSeed.enabled=true

# Master Data
- variable: global.catalogueRelease
  description: "Pin every Master Data read to a catalogue release (e.g. 2027.1): datasets and geography stay at the versions that release pins, so the registry does not change when newer versions are published. Leave empty to read the latest published versions."
  type: string
  default: ""
  label: Pinned Catalogue Release
  group: Master Data

# AWE
- variable: global.aweEnabled
  description: "Send change requests to the shared AWE (installed with commons-services) for approval, and seed this registry's approval policies and approver users."
  type: boolean
  label: Use AWE for Approvals
  group: AWE

- variable: global.aweHttpTimeoutSeconds
  description: HTTP timeout (seconds) for outbound AWE API calls
  type: int
  label: AWE HTTP Timeout (s)
  group: AWE
  show_if: global.aweEnabled=true

- variable: global.aweWebhookTimestampToleranceSeconds
  description: Max clock skew (seconds) for inbound AWE webhook signatures
  type: int
  label: AWE Webhook Timestamp Tolerance (s)
  group: AWE
  show_if: global.aweEnabled=true

- variable: global.aweApproverUserPassword
  description: "Initial Keycloak password of the approver users db-seed creates for the approval policies."
  type: string
  label: AWE Approver User Password
  group: AWE
  show_if: global.aweEnabled=true

# Audit Manager
- variable: global.auditEnabled
  description: "Send audit events to the Audit Manager installed with commons-services."
  type: boolean
  label: Audit Enabled
  group: Audit Manager

- variable: global.auditAnonymousFailures
  description: "Also audit rejected anonymous calls (401/403). Off audits only authenticated calls."
  type: boolean
  label: Audit Anonymous Failures
  group: Audit Manager
  show_if: global.auditEnabled=true

- variable: sanity.enabled
  description: Run the in-cluster sanity suite on every install/upgrade (smoke checks the Partner API is live and the DCI route is served). Best-effort — a failure does not block the deploy.
  type: boolean
  default: true
  label: Run Sanity Tests
  group: Sanity

- variable: sanity.runE2e
  description: Also run the full e2e. (1) Signed DCI + consent search — asserts a permitted, field-clamped result and that missing consent / bad signature are rejected. (2) Change request → AWE approval → applied change → version history → audit. This seeds test fixtures (a Keycloak user, a test record, a Partner Management key, a Consent Manager binding) and leaves them in place for inspection. Needs reachable PM, CM, AWE, Keycloak admin and the DBs, the enforcement switches ON, and the AWE issuer set to the external Keycloak URL. OFF by default; enable only on test environments.
  type: boolean
  default: false
  label: Sanity - Run Full E2E
  group: Sanity
  show_if: sanity.enabled=true

- variable: sanity.failOnError
  description: Fail the install/upgrade when a sanity test FAILS. Gates on failures, not skips — a test whose dependencies are not configured (no commons-services on a bring-up install) still skips and stays green. Turn off only where a red deploy is worse than an unverified one.
  type: boolean
  default: true
  label: Sanity - Fail the Deploy on Test Failure
  group: Sanity
  show_if: sanity.enabled=true

- variable: sanity.readinessTimeout
  description: Seconds the suite waits for the registry APIs to come up before giving up. Raise it on a slow or heavily-loaded cluster where pods take longer to pass their probes.
  type: int
  default: 180
  label: Sanity - API Readiness Timeout (s)
  group: Sanity
  show_if: sanity.enabled=true

- variable: sanity.aweSettleTimeout
  description: Seconds the e2e waits for AWE to apply an approved change request. AWE calls back asynchronously via webhook, so the change lands after the approval returns; too low a value fails a working deployment.
  type: int
  default: 90
  label: Sanity - AWE Settle Timeout (s)
  group: Sanity
  show_if: sanity.runE2e=true

- variable: global.csrfEnabled
  description: "Check a CSRF token on staff portal requests that change data. Leave on; turn off only to troubleshoot."
  type: boolean
  label: CSRF Enabled
  group: Security

# ---------------------------------------------------------------------------
# VC Issuance — the capability inside the Agent Portal API.
#
# Beyond these, turning issuance on needs things this form cannot supply:
# the manifestation's VC view + vcDefinitions, the Keycloak `agent` realm, and
# an eSignet provider row for registrant authentication. Edit YAML for those.
# ---------------------------------------------------------------------------
- variable: agentPortalApi.enabled
  description: >-
    MASTER SWITCH for verifiable credentials. Deploys the Agent Portal API —
    credential issuance at an agent counter. Agents are a distinct audience from
    staff (their own Keycloak realm), so this is separate from the Staff Portal.
    Off by default; off means nothing at all is deployed.
  type: boolean
  label: Verifiable Credentials (Agent Portal)
  group: VC Issuance

- variable: agentPortalUi.enabled
  description: >-
    Install the Agent Portal UI — the reference web client agents use to issue
    credentials. Needs the Agent Portal API.
  type: boolean
  label: Agent Portal UI
  group: VC Issuance
  show_if: agentPortalApi.enabled=true

- variable: global.agentPortalHostname
  description: >-
    Public hostname of the Agent Portal UI. Defaults to
    <release>-agent.<Base Domain> (e.g. registry-agent.trial.openg2p.org).
    This host is also registered as the redirect URI on the Keycloak
    agent-portal clients, so changing it here changes both.
  type: string
  label: Agent Portal Hostname
  group: VC Issuance
  show_if: agentPortalApi.enabled=true

- variable: agentPortalApi.vcIssuance.enabled
  description: >-
    Issue verifiable credentials from the Agent Portal. A credential is only
    issued after the beneficiary authenticates themselves via eSignet.
  type: boolean
  label: Enable VC Issuance
  group: VC Issuance
  show_if: agentPortalApi.enabled=true

- variable: agentPortalApi.vcIssuance.bootstrap.enabled
  description: >-
    Create the beneficiary-authentication setup automatically: the eSignet OIDC
    client (with a generated keypair), this register's eSignet provider row, the
    IAM application/role/permission that authorises issuance, and the register's
    "requires authentication" flag. Writes into eSignet's and IAM's databases as
    well as the registry's. Turn OFF only if another system owns that state — the
    four steps then have to be done by hand. Safe to re-run; it never replaces a
    key that is already in use.
  type: boolean
  default: true
  label: Bootstrap Beneficiary Authentication
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true

- variable: agentPortalApi.vcIssuance.bootstrap.esignet.hostname
  description: >-
    Public hostname of eSignet, used to derive the authorize/token/userinfo
    endpoints and the issuer this register trusts. Must be the eSignet the
    beneficiary is actually sent to.
  type: string
  label: eSignet Hostname
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.bootstrap.enabled=true

- variable: agentPortalApi.vcIssuance.bootstrap.esignet.acrValues
  description: >-
    How the beneficiary proves who they are at the counter.
    mosip:idp:acr:generated-code sends an OTP to their phone;
    mosip:idp:acr:biometrics captures a fingerprint or iris and needs no phone.
  type: enum
  options:
    - 'mosip:idp:acr:generated-code'
    - 'mosip:idp:acr:biometrics'
  default: 'mosip:idp:acr:generated-code'
  label: Beneficiary Authentication Factor
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.bootstrap.enabled=true

- variable: agentPortalApi.vcIssuance.registerId
  description: >-
    The register whose records may be issued credentials (Phase 1 issues to an
    individual). Required when VC issuance is enabled.
  type: string
  label: Register ID
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true

- variable: agentPortalApi.vcIssuance.authWindowSeconds
  description: >-
    How long the beneficiary's completed eSignet authentication may authorise an
    issuance, in seconds. Kept short — the beneficiary is at the counter.
  type: int
  default: 300
  label: Authentication Window (seconds)
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true

- variable: agentPortalApi.vcIssuance.authProviderId
  description: >-
    Identifier of this register's eSignet provider row. The bootstrap creates the
    row under this id and the Agent Portal API reads it, so the two cannot drift.
    Change it only if you created the provider row yourself under another id.
  type: string
  default: 'esignet-{{ .Release.Name }}'
  label: eSignet Provider ID
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true

- variable: global.vcIssuer.did
  description: >-
    DID of the authority that signs these credentials. Must be the DID Inji
    Certify was installed with, because Certify signs with the matching key and
    a verifier resolves this DID to fetch it. Defaults to the same derivation the
    Certify chart uses, so a standard install already agrees.
  type: string
  default: 'did:web:{{ tpl .Values.global.certifyHostname $ }}'
  label: Issuer DID
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true


- variable: global.certifyHostname
  description: >-
    Public hostname of Inji Certify. Must match the value used where Certify is
    installed (commons-services global.certifyHostname): it determines both the
    issuer DID stamped on credentials (did:web:<hostname>) and the audience
    Certify accepts on incoming proofs. Change this rather than the audience URL
    below — that is derived from it.
  type: string
  label: Certify Hostname
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true

- variable: global.certifyAudience
  description: >-
    Audience claim the Agent Portal puts in its proof JWT. It must be one of the
    values in Certify's `mosip.certify.authn.allowed-audiences`, which by default
    Certify derives from its PUBLIC domain — e.g.
    https://certify.<env>.openg2p.org/v1/certify/issuance/credential. This is NOT
    the in-cluster service URL used for certifyBaseUrl: the base URL is where we
    call Certify, the audience is what Certify expects to see inside the token.
    Getting it wrong fails issuance at the credential request with an invalid
    audience. Derived from the Certify Hostname above — set that instead, and
    only override here if Certify's allowed-audiences was customised.
  type: string
  # Same templated default as values.yaml, so leaving it untouched keeps the
  # hostname derivation instead of writing a literal placeholder into values.
  default: 'https://{{ tpl .Values.global.certifyHostname $ }}'
  label: Certify Proof Audience
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true
- variable: global.agentKeycloakRealm
  description: >-
    Keycloak realm agents authenticate against. Distinct from the staff realm —
    a staff token grants nothing on the Agent Portal API.
  type: string
  default: agent
  label: Agent Keycloak Realm
  group: VC Issuance
  show_if: agentPortalApi.enabled=true

- variable: agentPortalApi.pdf.issuerName
  description: Issuing authority name printed on the credential.
  type: string
  default: OpenG2P
  label: PDF Issuer Name
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true
