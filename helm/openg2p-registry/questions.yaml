# Logging is handled cluster-wide by OpenTelemetry + Loki; no per-chart config.

# DB Seed
- variable: dbSeed.enabled
  description: Run DB seed Job to load configuration SQL scripts after pods start
  type: boolean
  label: Enable DB Seed
  group: DB Seed

- variable: dbSeed.loadSampleData
  description: Also load sample/demo data into the registry (farmers, households, lands, crops, livestock, farm inputs, membership and supporting tables). Off by default.
  type: boolean
  label: Load Sample Data
  group: DB Seed

- variable: dbSeed.syncGeoWidgets
  description: Match this register's geo dropdowns to the hierarchy Master Data actually holds. An extension hard-codes its level names and how many there are; a country whose pack disagrees gets dropdowns that silently return nothing. Leave off to keep the metadata the extension shipped.
  type: boolean
  default: false
  label: Match Geo Dropdowns to Country
  group: DB Seed

- variable: dbSeed.loadGeoData
  description: "LEGACY. Loads a five-level country..village hierarchy into Master Data from a CSV, keyed by slug-paths. Leave OFF: Master Data seeds its own geography from a country pack keyed by P-code, and enabling this writes a second hierarchy over it in a different id space. Only for a deployment with no country pack."
  type: boolean
  default: false
  label: Load Legacy Geo Data (deprecated)
  group: DB Seed

- variable: dbSeed.loadImages
  description: Upload sample profile images to MinIO and link them to the seeded farmers. Requires Load Sample Data to be enabled.
  type: boolean
  label: Load Sample Images
  group: DB Seed

- variable: dbSeed.loadTemplates
  description: Upload Jinja templates from the db-seed image to MinIO after SQL seed (object key = filename). Requires MinIO to be reachable at global.minioHost.
  type: boolean
  label: Load Templates to MinIO
  group: DB Seed

- variable: dbSeed.image.repository
  description: Docker image repository for the DB seed container
  type: string
  label: DB Seed Image Repository
  group: DB Seed

- variable: dbSeed.image.tag
  description: Docker image tag for the DB seed container
  type: string
  label: DB Seed Image Tag
  group: DB Seed

# AWE
- variable: global.aweEnabled
  description: Enable AWE integration on staff-portal-api and seed AWE DB from db-seed job
  type: boolean
  label: Enable AWE Integration
  group: AWE

- variable: global.aweBaseUrl
  description: Public AWE API base URL (host only, no /v1/awe path)
  type: string
  label: AWE Base URL
  group: AWE

- variable: global.aweCallbackSecretId
  description: callback_secret.id in AWE DB (must match seeded row)
  type: string
  label: AWE Callback Secret ID
  group: AWE

- variable: global.aweHttpTimeoutSeconds
  description: HTTP timeout (seconds) for outbound AWE API calls
  type: int
  label: AWE HTTP Timeout (s)
  group: AWE

- variable: global.aweWebhookTimestampToleranceSeconds
  description: Max clock skew (seconds) for inbound AWE webhook signatures
  type: int
  label: AWE Webhook Timestamp Tolerance (s)
  group: AWE

- variable: global.aweApproverUserPassword
  description: Initial Keycloak password for seeded approver users
  type: string
  label: AWE Approver User Password
  group: AWE

# ID Generator
- variable: idgenerator.idGenerator.appConfig.idTypesNote
  description: "Default ID types: farmer (12 digits), household (10 digits). To add, remove, or modify ID types, switch to 'Edit YAML' and update the idgenerator.idGenerator.appConfig.idTypes section."
  type: string
  label: ID Types Configuration
  group: ID Generator
  default: "See description — edit YAML to configure"

# Audit Manager
- variable: global.auditEnabled
  description: Master switch for emitting audit events to OpenG2P Audit Manager. Must be true AND global.auditManagerUrl must be set for any audits to flow. Available from staff-portal-api 1.1.x.
  type: boolean
  label: Audit Enabled
  group: Audit Manager

- variable: global.auditManagerUrl
  description: Internal URL of the OpenG2P Audit Manager service (e.g. http://audit-manager:80 when in the same namespace).
  type: string
  label: Audit Manager URL
  group: Audit Manager

- variable: global.auditAnonymousFailures
  description: When true, also audit rejected anonymous calls (401/403). Set false to skip them and only audit authenticated user calls.
  type: boolean
  label: Audit Anonymous Failures
  group: Audit Manager

- variable: sanity.enabled
  description: Run the in-cluster sanity suite on every install/upgrade (smoke checks the Partner API is live and the DCI route is served). Best-effort — a failure does not block the deploy.
  type: boolean
  default: true
  label: Run Sanity Tests
  group: Sanity

- variable: sanity.runE2e
  description: Also run the full e2e. (1) Signed DCI + consent search — asserts a permitted, field-clamped result and that missing consent / bad signature are rejected. (2) Change request → AWE approval → applied change → version history → audit. This seeds test fixtures (a Keycloak user, a test farmer, a Partner Management key, a Consent Manager binding) and leaves them in place for inspection. Needs reachable PM, CM, AWE, Keycloak admin and the DBs, the enforcement switches ON, and the AWE issuer set to the external Keycloak URL. OFF by default; enable only on test environments.
  type: boolean
  default: false
  label: Sanity - Run Full E2E
  group: Sanity

- variable: sanity.failOnError
  description: Fail the install/upgrade when a sanity test FAILS. Gates on failures, not skips — a test whose dependencies are not configured (no commons-services on a bring-up install) still skips and stays green. Turn off only where a red deploy is worse than an unverified one.
  type: boolean
  default: true
  label: Sanity - Fail the Deploy on Test Failure
  group: Sanity

- variable: sanity.readinessTimeout
  description: Seconds the suite waits for the registry APIs to come up before giving up. Raise it on a slow or heavily-loaded cluster where pods take longer to pass their probes.
  type: int
  default: 180
  label: Sanity - API Readiness Timeout (s)
  group: Sanity

- variable: sanity.searchText
  description: "What the e2e DCI search matches on (ILIKE against search_text). Must be the sanity record's functional_record_id: the change-request test runs first and its approval regenerates search_text from the record's real columns, dropping any manually-stuffed marker. The seeder builds its record from this same value, so the two cannot drift."
  type: string
  default: SANITY-INDIVIDUAL-0001
  label: Sanity - Record Search Text
  group: Sanity

- variable: sanity.regType
  description: Register type the e2e exercises. Must match a register this deployment actually ships — the reference registry is Individual; a variant overrides it (farmer-registry uses Farmer).
  type: string
  default: Individual
  label: Sanity - Register Type
  group: Sanity

- variable: sanity.dataScopes
  description: "Comma-separated scopes the seeded consent policy allows, and which the e2e asserts come back. These MUST be top-level keys of this register's outgoing DCI template — clamping is a strict allow-list over the rendered record's top-level keys, so a scope naming anything else silently clamps every record to empty."
  type: string
  default: "demographic_info"
  label: Sanity - Consented Data Scopes
  group: Sanity

- variable: sanity.deniedScopes
  description: Comma-separated scopes deliberately NOT consented to. The e2e asserts these never appear in a response — this is the test that proves consent clamping actually clamps.
  type: string
  default: "member_identifier"
  label: Sanity - Denied Data Scopes
  group: Sanity

- variable: sanity.aweSettleTimeout
  description: Seconds the e2e waits for AWE to apply an approved change request. AWE calls back asynchronously via webhook, so the change lands after the approval returns; too low a value fails a working deployment.
  type: int
  default: 90
  label: Sanity - AWE Settle Timeout (s)
  group: Sanity

- variable: global.consentManagerStaffUrl
  description: Consent Manager staff-portal-api base URL — used only by the sanity e2e to seed the test partner's binding + policy.
  type: string
  default: 'http://commons-services-cm-api'
  label: Consent Manager Staff URL (e2e seed)
  group: Sanity
  show_if: sanity.runE2e=true

- variable: global.partnerManagementAdminApiUrl
  description: Partner Management staff-portal-api base URL — used only by the sanity e2e to onboard + approve the test partner's key.
  type: string
  default: 'http://commons-services-pm-staff-portal-api'
  label: Partner Management Admin URL (e2e seed)
  group: Sanity
  show_if: sanity.runE2e=true
- variable: global.csrfEnabled
  description: Enable double-submit CSRF validation on state-changing staff-portal-api requests. Set false for local/dev troubleshooting only.
  type: boolean
  label: CSRF Enabled
  group: Security
