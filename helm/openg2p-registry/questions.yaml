questions:

# General
- variable: global.registryHostname
  description: Hostname under which all Registry services will be accessed
  type: string
  label: Registry Hostname
  group: General

- variable: global.postgresqlHost
  description: PostgreSQL server host
  type: string
  label: PostgreSQL Server Host
  group: General

- variable: global.keycloakBaseUrl
  description: Keycloak Base URL used in all components
  type: string
  label: Keycloak Base URL
  group: General

- variable: global.minioHost
  description: "External MinIO S3 API endpoint reachable from end-user browsers (the registry generates pre-signed S3 URLs that browsers follow directly). Use the API hostname exposed by commons-base, NOT the Console hostname. Example: minio-api.<namespace>.openg2p.org (do not include scheme or trailing slash). MinIO is assumed to be served over HTTPS via the Istio gateway."
  type: string
  label: MinIO S3 API Host
  group: General

- variable: keycloak-init.enabled
  description: Run Keycloak Init to create realm and OIDC client
  type: boolean
  label: Keycloak Init
  group: General

- variable: staffApi.enabled
  description: Install Staff Portal API
  type: boolean
  label: Staff Portal API
  group: General

- variable: staffUi.enabled
  description: Install Staff Portal UI
  type: boolean
  label: Staff Portal UI
  group: General

- variable: partnerApi.enabled
  description: Install Partner API
  type: boolean
  label: Partner API
  group: General

- variable: global.partnerSignatureValidationEnabled
  description: Verify the DCI request signature against Partner Management keys (Partner API). ON by default (fail-closed). Turn OFF only for testing or bring-up before Partner Management is wired — doing so accepts unsigned requests.
  type: boolean
  default: true
  label: Verify Partner Signature
  group: Consent & Partner API

- variable: global.consentEnforcementEnabled
  description: Enforce consent via the Consent Manager before returning data (Partner API), clamping fields to consented scopes. Requires a reachable Consent Manager. ON by default (fail-closed). Turn OFF only for testing or bring-up — doing so returns records unclamped to any caller.
  type: boolean
  default: true
  label: Enforce Consent
  group: Consent & Partner API

- variable: global.registryCryptoBackend
  description: How the Partner API verifies partner keys. 'partner-mgmt' fetches keys from Partner Management (recommended); 'keymanager' uses the legacy Mosip Keymanager; 'local' uses seeded keys (tests).
  type: enum
  options:
    - partner-mgmt
    - keymanager
    - local
  default: partner-mgmt
  label: Partner Key Verification Backend
  group: Consent & Partner API

- variable: global.partnerManagementApiUrl
  description: Partner Management partner-api base URL — source of partner public keys used to verify DCI signatures and consent objects.
  type: string
  default: 'http://commons-services-pm-partner-api'
  label: Partner Management URL
  group: Consent & Partner API

- variable: global.consentManagerUrl
  description: Consent Manager partner-api base URL (the /validate PDP endpoint) used when consent enforcement is enabled.
  type: string
  default: 'http://commons-services-cm-partner-api'
  label: Consent Manager URL
  group: Consent & Partner API

- variable: beneApi.enabled
  description: Install Beneficiary Portal API
  type: boolean
  label: Beneficiary Portal API
  group: General


- variable: idgenerator.enabled
  description: Install ID Generator service
  type: boolean
  label: ID Generator
  group: General

