# Logging is handled cluster-wide by OpenTelemetry + Loki; no per-chart config.

# DB Seed
- variable: dbSeed.enabled
  description: Run DB seed Job to load configuration SQL scripts after pods start
  type: boolean
  label: Enable DB Seed
  group: DB Seed

- variable: dbSeed.loadSampleData
  description: Also load sample/demo data into the registry (farmers, households, lands, crops, livestock, farm inputs, membership and supporting tables). Off by default.
  type: boolean
  label: Load Sample Data
  group: DB Seed

- variable: dbSeed.loadAttributes
  description: Copy the country's code lists from Master Data into this registry's own tables at install, then read them from there. Country-agnostic — it takes whatever pack Master Data holds, and does nothing when it holds none. This is what lets one registry image serve any country.
  type: boolean
  default: false
  label: Load Code Lists from Master Data
  group: DB Seed

- variable: dbSeed.attributeDomains
  description: "Domain code lists to copy alongside the core ones, comma-separated. Use 'agriculture' for a Farmer Registry; leave empty for a social registry."
  type: string
  default: ""
  label: Domain Code Lists
  group: DB Seed

- variable: dbSeed.syncGeoWidgets
  description: Match this register's geo dropdowns to the hierarchy Master Data actually holds. An extension hard-codes its level names and how many there are; a country whose pack disagrees gets dropdowns that silently return nothing. Leave off to keep the metadata the extension shipped.
  type: boolean
  default: false
  label: Match Geo Dropdowns to Country
  group: DB Seed

- variable: dbSeed.loadGeoData
  description: "LEGACY. Loads a five-level country..village hierarchy into Master Data from a CSV, keyed by slug-paths. Leave OFF: Master Data seeds its own geography from a country pack keyed by P-code, and enabling this writes a second hierarchy over it in a different id space. Only for a deployment with no country pack."
  type: boolean
  default: false
  label: Load Legacy Geo Data (deprecated)
  group: DB Seed

- variable: dbSeed.loadImages
  description: Upload sample profile images to MinIO and link them to the seeded farmers. Requires Load Sample Data to be enabled.
  type: boolean
  label: Load Sample Images
  group: DB Seed

- variable: dbSeed.loadTemplates
  description: Upload Jinja templates from the db-seed image to MinIO after SQL seed (object key = filename). Requires MinIO to be reachable at global.minioHost.
  type: boolean
  label: Load Templates to MinIO
  group: DB Seed

- variable: dbSeed.image.repository
  description: Docker image repository for the DB seed container
  type: string
  label: DB Seed Image Repository
  group: DB Seed

- variable: dbSeed.image.tag
  description: Docker image tag for the DB seed container
  type: string
  label: DB Seed Image Tag
  group: DB Seed

# AWE
- variable: global.aweEnabled
  description: Enable AWE integration on staff-portal-api and seed AWE DB from db-seed job
  type: boolean
  label: Enable AWE Integration
  group: AWE

- variable: global.aweBaseUrl
  description: Public AWE API base URL (host only, no /v1/awe path)
  type: string
  label: AWE Base URL
  group: AWE

- variable: global.aweCallbackSecretId
  description: callback_secret.id in AWE DB (must match seeded row)
  type: string
  label: AWE Callback Secret ID
  group: AWE

- variable: global.aweHttpTimeoutSeconds
  description: HTTP timeout (seconds) for outbound AWE API calls
  type: int
  label: AWE HTTP Timeout (s)
  group: AWE

- variable: global.aweWebhookTimestampToleranceSeconds
  description: Max clock skew (seconds) for inbound AWE webhook signatures
  type: int
  label: AWE Webhook Timestamp Tolerance (s)
  group: AWE

- variable: global.aweApproverUserPassword
  description: Initial Keycloak password for seeded approver users
  type: string
  label: AWE Approver User Password
  group: AWE

# ID Generator
- variable: idgenerator.idGenerator.appConfig.idTypesNote
  description: "One functional-ID pool per register that mints IDs. Which pools are needed depends on the registry being installed — a single-register registry needs exactly one, and its pool name is that register's mnemonic in lowercase. Pools ACCUMULATE from three layers, because Helm merges maps and a parent cannot delete a subchart default: the id-generator subchart defaults (farmer, household), this chart's defaults (individual, household), and the installed registry's own. Seeing pools you do not recognise is therefore expected — an unused pool is an empty table that allocates nothing. Check only that YOUR register's pool is present. To add, remove or modify pools, switch to 'Edit YAML' and update the idgenerator.idGenerator.appConfig.idTypes section."
  type: string
  label: ID Types Configuration
  group: ID Generator
  default: "See description — edit YAML to configure"

# Audit Manager
- variable: global.auditEnabled
  description: Master switch for emitting audit events to OpenG2P Audit Manager. Must be true AND global.auditManagerUrl must be set for any audits to flow. Available from staff-portal-api 1.1.x.
  type: boolean
  label: Audit Enabled
  group: Audit Manager

- variable: global.auditManagerUrl
  description: Internal URL of the OpenG2P Audit Manager service (e.g. http://audit-manager:80 when in the same namespace).
  type: string
  label: Audit Manager URL
  group: Audit Manager

- variable: global.auditAnonymousFailures
  description: When true, also audit rejected anonymous calls (401/403). Set false to skip them and only audit authenticated user calls.
  type: boolean
  label: Audit Anonymous Failures
  group: Audit Manager

- variable: sanity.enabled
  description: Run the in-cluster sanity suite on every install/upgrade (smoke checks the Partner API is live and the DCI route is served). Best-effort — a failure does not block the deploy.
  type: boolean
  default: true
  label: Run Sanity Tests
  group: Sanity

- variable: sanity.runE2e
  description: Also run the full e2e. (1) Signed DCI + consent search — asserts a permitted, field-clamped result and that missing consent / bad signature are rejected. (2) Change request → AWE approval → applied change → version history → audit. This seeds test fixtures (a Keycloak user, a test farmer, a Partner Management key, a Consent Manager binding) and leaves them in place for inspection. Needs reachable PM, CM, AWE, Keycloak admin and the DBs, the enforcement switches ON, and the AWE issuer set to the external Keycloak URL. OFF by default; enable only on test environments.
  type: boolean
  default: false
  label: Sanity - Run Full E2E
  group: Sanity

- variable: sanity.failOnError
  description: Fail the install/upgrade when a sanity test FAILS. Gates on failures, not skips — a test whose dependencies are not configured (no commons-services on a bring-up install) still skips and stays green. Turn off only where a red deploy is worse than an unverified one.
  type: boolean
  default: true
  label: Sanity - Fail the Deploy on Test Failure
  group: Sanity

- variable: sanity.readinessTimeout
  description: Seconds the suite waits for the registry APIs to come up before giving up. Raise it on a slow or heavily-loaded cluster where pods take longer to pass their probes.
  type: int
  default: 180
  label: Sanity - API Readiness Timeout (s)
  group: Sanity

- variable: sanity.searchText
  description: "What the e2e DCI search matches on (ILIKE against search_text). Must be the sanity record's functional_record_id: the change-request test runs first and its approval regenerates search_text from the record's real columns, dropping any manually-stuffed marker. The seeder builds its record from this same value, so the two cannot drift."
  type: string
  default: SANITY-INDIVIDUAL-0001
  label: Sanity - Record Search Text
  group: Sanity

- variable: sanity.regType
  description: Register type the e2e exercises. Must match a register this deployment actually ships — the reference registry is Individual; a variant overrides it (farmer-registry uses Farmer).
  type: string
  default: Individual
  label: Sanity - Register Type
  group: Sanity

- variable: sanity.dataScopes
  description: "Comma-separated scopes the seeded consent policy allows, and which the e2e asserts come back. These MUST be top-level keys of this register's outgoing DCI template — clamping is a strict allow-list over the rendered record's top-level keys, so a scope naming anything else silently clamps every record to empty."
  type: string
  default: "demographic_info"
  label: Sanity - Consented Data Scopes
  group: Sanity

- variable: sanity.deniedScopes
  description: Comma-separated scopes deliberately NOT consented to. The e2e asserts these never appear in a response — this is the test that proves consent clamping actually clamps.
  type: string
  default: "member_identifier"
  label: Sanity - Denied Data Scopes
  group: Sanity

- variable: sanity.aweSettleTimeout
  description: Seconds the e2e waits for AWE to apply an approved change request. AWE calls back asynchronously via webhook, so the change lands after the approval returns; too low a value fails a working deployment.
  type: int
  default: 90
  label: Sanity - AWE Settle Timeout (s)
  group: Sanity

- variable: global.consentManagerStaffUrl
  description: Consent Manager staff-portal-api base URL — used only by the sanity e2e to seed the test partner's binding + policy.
  type: string
  default: 'http://commons-services-cm-api'
  label: Consent Manager Staff URL (e2e seed)
  group: Sanity
  show_if: sanity.runE2e=true

- variable: global.partnerManagementAdminApiUrl
  description: Partner Management staff-portal-api base URL — used only by the sanity e2e to onboard + approve the test partner's key.
  type: string
  default: 'http://commons-services-pm-staff-portal-api'
  label: Partner Management Admin URL (e2e seed)
  group: Sanity
  show_if: sanity.runE2e=true
- variable: global.csrfEnabled
  description: Enable double-submit CSRF validation on state-changing staff-portal-api requests. Set false for local/dev troubleshooting only.
  type: boolean
  label: CSRF Enabled
  group: Security

# ---------------------------------------------------------------------------
# VC Issuance — the capability inside the Agent Portal API.
#
# Beyond these, turning issuance on needs things this form cannot supply:
# the manifestation's VC view + vcDefinitions, the Keycloak `agent` realm, and
# an eSignet provider row for registrant authentication. Edit YAML for those.
# ---------------------------------------------------------------------------
- variable: agentPortalApi.enabled
  description: >-
    MASTER SWITCH for verifiable credentials. Deploys the Agent Portal API —
    credential issuance at an agent counter. Agents are a distinct audience from
    staff (their own Keycloak realm), so this is separate from the Staff Portal.
    Off by default; off means nothing at all is deployed.
  type: boolean
  label: Verifiable Credentials (Agent Portal)
  group: VC Issuance

- variable: agentPortalUi.enabled
  description: >-
    Install the Agent Portal UI — the reference web client agents use to issue
    credentials. Needs the Agent Portal API.
  type: boolean
  label: Agent Portal UI
  group: VC Issuance
  show_if: agentPortalApi.enabled=true

- variable: global.agentPortalHostname
  description: >-
    Public hostname of the Agent Portal UI. Defaults to
    <release>-agent.<namespace>.openg2p.org (e.g. fr-agent.trial.openg2p.org).
    This host is also registered as the redirect URI on the Keycloak
    agent-portal clients, so changing it here changes both.
  type: string
  default: '{{ .Release.Name }}-agent.{{ .Release.Namespace }}.openg2p.org'
  label: Agent Portal Hostname
  group: VC Issuance
  show_if: agentPortalApi.enabled=true

- variable: agentPortalApi.vcIssuance.enabled
  description: >-
    Issue verifiable credentials from the Agent Portal. A credential is only
    issued after the beneficiary authenticates themselves via eSignet.
  type: boolean
  label: Enable VC Issuance
  group: VC Issuance
  show_if: agentPortalApi.enabled=true

- variable: agentPortalApi.vcIssuance.bootstrap.enabled
  description: >-
    Create the beneficiary-authentication setup automatically: the eSignet OIDC
    client (with a generated keypair), this register's eSignet provider row, the
    IAM application/role/permission that authorises issuance, and the register's
    "requires authentication" flag. Writes into eSignet's and IAM's databases as
    well as the registry's. Turn OFF only if another system owns that state — the
    four steps then have to be done by hand. Safe to re-run; it never replaces a
    key that is already in use.
  type: boolean
  default: true
  label: Bootstrap Beneficiary Authentication
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true

- variable: agentPortalApi.vcIssuance.bootstrap.esignet.hostname
  description: >-
    Public hostname of eSignet, used to derive the authorize/token/userinfo
    endpoints and the issuer this register trusts. Must be the eSignet the
    beneficiary is actually sent to.
  type: string
  default: 'esignet.{{ .Release.Namespace }}.openg2p.org'
  label: eSignet Hostname
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.bootstrap.enabled=true

- variable: agentPortalApi.vcIssuance.bootstrap.esignet.acrValues
  description: >-
    How the beneficiary proves who they are at the counter.
    mosip:idp:acr:generated-code sends an OTP to their phone;
    mosip:idp:acr:biometrics captures a fingerprint or iris and needs no phone.
  type: enum
  options:
    - 'mosip:idp:acr:generated-code'
    - 'mosip:idp:acr:biometrics'
  default: 'mosip:idp:acr:generated-code'
  label: Beneficiary Authentication Factor
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.bootstrap.enabled=true

- variable: agentPortalApi.vcIssuance.registerId
  description: >-
    The register whose records may be issued credentials (Phase 1 issues to an
    individual). Required when VC issuance is enabled.
  type: string
  label: Register ID
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true

- variable: agentPortalApi.vcIssuance.authWindowSeconds
  description: >-
    How long the beneficiary's completed eSignet authentication may authorise an
    issuance, in seconds. Kept short — the beneficiary is at the counter.
  type: int
  default: 300
  label: Authentication Window (seconds)
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true

- variable: agentPortalApi.vcIssuance.authProviderId
  description: >-
    Identifier of this register's eSignet provider row. The bootstrap creates the
    row under this id and the Agent Portal API reads it, so the two cannot drift.
    Change it only if you created the provider row yourself under another id.
  type: string
  default: 'esignet-{{ .Release.Name }}'
  label: eSignet Provider ID
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true

- variable: global.vcIssuer.did
  description: >-
    DID of the authority that signs these credentials. Must be the DID Inji
    Certify was installed with, because Certify signs with the matching key and
    a verifier resolves this DID to fetch it. Defaults to the same derivation the
    Certify chart uses, so a standard install already agrees.
  type: string
  default: 'did:web:{{ tpl .Values.global.certifyHostname $ }}'
  label: Issuer DID
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true

- variable: global.certifyBaseUrl
  description: >-
    In-cluster base URL of Inji Certify, the credential issuer. One shared
    Certify per environment, installed with the commons layer.
  type: string
  default: http://commons-services-inji-certify/v1/certify
  label: Inji Certify Base URL
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true


- variable: global.certifyHostname
  description: >-
    Public hostname of Inji Certify. Must match the value used where Certify is
    installed (commons-services global.certifyHostname): it determines both the
    issuer DID stamped on credentials (did:web:<hostname>) and the audience
    Certify accepts on incoming proofs. Change this rather than the audience URL
    below — that is derived from it.
  type: string
  default: certify.<namespace>.openg2p.org
  label: Certify Hostname
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true

- variable: global.certifyAudience
  description: >-
    Audience claim the Agent Portal puts in its proof JWT. It must be one of the
    values in Certify's `mosip.certify.authn.allowed-audiences`, which by default
    Certify derives from its PUBLIC domain — e.g.
    https://certify.<env>.openg2p.org/v1/certify/issuance/credential. This is NOT
    the in-cluster service URL used for certifyBaseUrl: the base URL is where we
    call Certify, the audience is what Certify expects to see inside the token.
    Getting it wrong fails issuance at the credential request with an invalid
    audience. Derived from the Certify Hostname above — set that instead, and
    only override here if Certify's allowed-audiences was customised.
  type: string
  default: https://<certify-hostname>/v1/certify/issuance/credential
  label: Certify Proof Audience
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true
- variable: global.agentKeycloakRealm
  description: >-
    Keycloak realm agents authenticate against. Distinct from the staff realm —
    a staff token grants nothing on the Agent Portal API.
  type: string
  default: agent
  label: Agent Keycloak Realm
  group: VC Issuance
  show_if: agentPortalApi.enabled=true

- variable: agentPortalApi.pdf.issuerName
  description: Issuing authority name printed on the credential.
  type: string
  default: OpenG2P
  label: PDF Issuer Name
  group: VC Issuance
  show_if: agentPortalApi.vcIssuance.enabled=true
